<text x="440" y="394" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Dans les trois cas, c'est une règle humaine qui décide de ce que l'on entend. Publier la règle est ce qui distingue une œuvre honnête d'un tour de passe-passe.</text>
