<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="900" height="560" fill="#FBF9F1"/>
<text x="450" y="34" font-family="Cormorant Garamond, serif" font-size="17.4" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.6">THREE WAYS OF MAKING A SIGNAL “SPEAK”</text>
<rect x="330" y="62" width="240" height="54" rx="8" fill="#EAF3ED" stroke="#3F7D5A" stroke-width="1.6"/>
<text x="450.0" y="79" font-family="Lato, sans-serif" font-size="15.22" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A measured time series</text>
<text x="450.0" y="94.0" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">x(t) — a dated physical quantity</text>
<rect x="40" y="150" width="240" height="330" rx="9" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.8"/>
<rect x="40" y="150" width="240" height="26" rx="9" fill="#3F7D5A"/>
<rect x="40" y="167" width="240" height="9" fill="#3F7D5A"/>
<text x="160" y="168" font-family="Lato, sans-serif" font-size="12.18" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">A · SONIFICATION</text>
<rect x="54" y="196" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="160" y="217" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Parametric mapping</text>
<text x="160" y="234" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">quantity → pitch, timbre, duration</text>
<line x1="160" y1="256" x2="160" y2="268" stroke="#3F7D5A" stroke-width="1.8" marker-end="url(#ahv)"/>
<rect x="54" y="272" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="160" y="293" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Synthesis / MIDI</text>
<text x="160" y="310" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">an explicit, reversible rule</text>
<line x1="54" y1="356" x2="266" y2="356" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="160" y="378" font-family="Lato, sans-serif" font-size="11.89" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The signal determines the output entirely.</text>
<text x="160" y="400" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Control:</text>
<text x="160" y="416" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Verifiable: one can work back from</text>
<text x="160" y="428" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">the sound to the data.</text>
<line x1="160" y1="118" x2="160" y2="146" stroke="#3F7D5A" stroke-width="2.0" marker-end="url(#ahv)"/>
<rect x="330" y="150" width="240" height="330" rx="9" fill="#FFFFFF" stroke="#2F5E86" stroke-width="1.8"/>
<rect x="330" y="150" width="240" height="26" rx="9" fill="#2F5E86"/>
<rect x="330" y="167" width="240" height="9" fill="#2F5E86"/>
<text x="450" y="168" font-family="Lato, sans-serif" font-size="12.18" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">B · CLASSIFICATION</text>
<rect x="344" y="196" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="450" y="217" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Descriptors</text>
<text x="450" y="234" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">mean, slope, variance, spectrum</text>
<line x1="450" y1="256" x2="450" y2="268" stroke="#2F5E86" stroke-width="1.8" marker-end="url(#ahb)"/>
<rect x="344" y="272" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="450" y="293" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A trained model</text>
<text x="450" y="310" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">→ a label: “water stress”</text>
<line x1="344" y1="356" x2="556" y2="356" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="450" y="378" font-family="Lato, sans-serif" font-size="11.89" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The signal selects among known states.</text>
<text x="450" y="400" font-family="Lato, sans-serif" font-size="10.73" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Control:</text>
<text x="450" y="416" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Verifiable: a confusion matrix, a</text>
<text x="450" y="428" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">test set.</text>
<line x1="450" y1="118" x2="450" y2="146" stroke="#2F5E86" stroke-width="2.0" marker-end="url(#ahb)"/>
<rect x="620" y="150" width="240" height="330" rx="9" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.8"/>
<rect x="620" y="150" width="240" height="26" rx="9" fill="#A8552E"/>
<rect x="620" y="167" width="240" height="9" fill="#A8552E"/>
<text x="740" y="168" font-family="Lato, sans-serif" font-size="12.18" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">C · VERBALIZATION</text>
<rect x="634" y="196" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="740" y="217" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Descriptors → prompt</text>
<text x="740" y="234" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">numbers dropped into a template</text>
<line x1="740" y1="256" x2="740" y2="268" stroke="#A8552E" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="634" y="272" width="212" height="58" rx="8" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.1"/>
<text x="740" y="293" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The language model</text>
<text x="740" y="310" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">→ sentences in natural language</text>
<line x1="634" y1="356" x2="846" y2="356" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="740" y="378" font-family="Lato, sans-serif" font-size="11.89" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The signal conditions, the model writes.</text>
<text x="740" y="400" font-family="Lato, sans-serif" font-size="10.73" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Control:</text>
<text x="740" y="416" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Not verifiable word by word: the</text>
<text x="740" y="428" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">wording comes from the model.</text>
<line x1="740" y1="118" x2="740" y2="146" stroke="#A8552E" stroke-width="2.0" marker-end="url(#ah)"/>
<path d="M160,140 L450,120 L740,140" fill="none" stroke="#D9D9C6" stroke-width="1.2"/>
<text x="450" y="512" font-family="Lato, sans-serif" font-size="12.47" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The share of information that really comes from the plant falls from A to C. The share of seduction rises.</text>
<text x="450" y="534" font-family="Lato, sans-serif" font-size="12.18" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">None of the three is illegitimate — but they do not announce themselves the same way.</text>
</svg>
