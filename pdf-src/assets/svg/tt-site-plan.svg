<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="840" height="470">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="840" height="470" fill="#FBF9F1"/>
<text x="420" y="34" font-family="Cormorant Garamond, serif" font-size="17.4" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="3">THE SITE PLAN</text>
<text x="420" y="55" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Seen from above — a tree, its sensors and its protection zone</text>
<circle cx="330" cy="262" r="170" fill="#EDEADB" stroke="#6FA98A" stroke-width="1.6" stroke-dasharray="7 5"/>
<text x="330" y="110" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">protected root zone — no machinery, no compaction</text>
<circle cx="330" cy="262" r="118" fill="#D7E3D2" opacity="0.75"/>
<text x="414" y="170" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the crown projection</text>
<circle cx="330" cy="262" r="26" fill="#8A7455" stroke="#5C4B34" stroke-width="2"/>
<circle cx="330" cy="236" r="9" fill="#A8552E" stroke="#FFF" stroke-width="1.8"/>
<text x="330" y="239.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">E1</text>
<text x="330" y="192" font-family="Lato, sans-serif" font-size="10.44" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">north electrodes</text>
<circle cx="356" cy="262" r="9" fill="#A8552E" stroke="#FFF" stroke-width="1.8"/>
<text x="356" y="265.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">E2</text>
<text x="400" y="268" font-family="Lato, sans-serif" font-size="10.44" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">south electrodes</text>
<circle cx="238" cy="302" r="9" fill="#3F7D5A" stroke="#FFF" stroke-width="1.8"/>
<text x="238" y="305.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">P1</text>
<text x="178" y="326" font-family="Lato, sans-serif" font-size="10.44" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">soil probe 20 cm</text>
<circle cx="426" cy="324" r="9" fill="#3F7D5A" stroke="#FFF" stroke-width="1.8"/>
<text x="426" y="327.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">P2</text>
<text x="470" y="342" font-family="Lato, sans-serif" font-size="10.44" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">soil probe 60 cm</text>
<circle cx="322" cy="144" r="9" fill="#2F5E86" stroke="#FFF" stroke-width="1.8"/>
<text x="322" y="147.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">M1</text>
<text x="292" y="120" font-family="Lato, sans-serif" font-size="10.44" fill="#2F5E86" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">weather shelter 2 m</text>
<circle cx="392" cy="178" r="9" fill="#B08528" stroke="#FFF" stroke-width="1.8"/>
<text x="392" y="181.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A1</text>
<text x="444" y="164" font-family="Lato, sans-serif" font-size="10.44" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">acoustic sensor</text>
<circle cx="480" cy="122" r="9" fill="#B08528" stroke="#FFF" stroke-width="1.8"/>
<text x="480" y="125.2" font-family="Lato, sans-serif" font-size="9.6" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">S1</text>
<text x="496" y="104" font-family="Lato, sans-serif" font-size="10.44" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">solar panel facing due south</text>
<rect x="580" y="96" width="242" height="304" rx="7" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1.2"/>
<text x="701" y="118" font-family="Lato, sans-serif" font-size="13.92" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Siting rules</text>
<line x1="596" y1="130" x2="806" y2="130" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="596" y="146" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Electrodes</text>
<text x="596" y="158.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Two opposed pairs: the differential</text>
<text x="596" y="168.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">cancels the common mode.</text>
<text x="596" y="190" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Soil probes</text>
<text x="596" y="202.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Two depths at least, away from the</text>
<text x="596" y="212.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">footpath.</text>
<text x="596" y="234" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Weather shelter</text>
<text x="596" y="246.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">At 2 m, ventilated, never against the</text>
<text x="596" y="256.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">trunk nor in full sun.</text>
<text x="596" y="278" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Enclosure</text>
<text x="596" y="290.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">North of the trunk, on a wide collar,</text>
<text x="596" y="300.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1.80 m above the ground.</text>
<text x="596" y="322" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Cables</text>
<text x="596" y="334.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">In flexible trunking, with an expansion</text>
<text x="596" y="344.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">loop at each end.</text>
<text x="596" y="366" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Signage</text>
<text x="596" y="378.0" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A sign explains the installation: it is</text>
<text x="596" y="388.5" font-family="Lato, sans-serif" font-size="10.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">what prevents vandalism.</text>
<text x="420" y="440" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The plan is dated, photographed and archived: without it, no measurement will be re-readable in five years.</text>
</svg>
