<rect x="60" y="378" width="860" height="22" rx="3" fill="#FAFBFA" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="393" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ground via under the packages</text>
<text x="908" y="393" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">on a 1.2 mm grid</text>
<rect x="60" y="404" width="860" height="22" rx="3" fill="#fff" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="419" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">USB differential impedance</text>
<text x="908" y="419" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">90 Ω ± 10 % (layer 4 over layer 3)</text>
<rect x="60" y="430" width="860" height="22" rx="3" fill="#FAFBFA" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="445" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ADC clock impedance</text>
<text x="908" y="445" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">50 Ω single-ended</text>
<rect x="60" y="456" width="860" height="22" rx="3" fill="#fff" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="471" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Finish</text>
<text x="908" y="471" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">ENIG — mandatory under the electrometer inputs</text>
<rect x="60" y="482" width="860" height="22" rx="3" fill="#FAFBFA" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="497" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Mask keep-out</text>
<text x="908" y="497" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">under J1, J2 and the guard ring</text>
<rect x="60" y="508" width="860" height="22" rx="3" fill="#fff" stroke="#D9D9C6" stroke-width="0.8"/>
<text x="72" y="523" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">IPC class</text>
<text x="908" y="523" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">2 (standard fabrication, no extra cost)</text>
<rect x="60" y="550" width="860" height="116" rx="5" fill="#FBEEE6" stroke="#A8552E" stroke-width="1.1"/>
<text x="74" y="578" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">THE POINT THAT SINKS A FIRST PRODUCTION RUN</text>
<text x="74" y="602" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The mask keep-out under the inputs is not a cosmetic detail: a film of</text>
<text x="74" y="624" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">damp solder mask conducts quite enough to ruin a 10¹⁵ Ω measurement. It is the</text>
<text x="74" y="646" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">first thing to check when a channel drifts for no apparent reason.</text>
<text x="28" y="632" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
