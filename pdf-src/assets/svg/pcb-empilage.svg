<text x="492" y="221.0" font-family="Lato, sans-serif" font-size="18.25" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Prepreg 7628 x1</text>
<text x="474" y="221.0" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">0,20 mm</text>
