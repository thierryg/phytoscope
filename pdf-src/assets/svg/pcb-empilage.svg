<text x="74" y="578" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">LE POINT QUI FAIT ÉCHOUER LES PREMIÈRES SÉRIES</text>
<text x="74" y="602" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le vernis épargné sous les entrées n'est pas un détail esthétique : un film</text>
