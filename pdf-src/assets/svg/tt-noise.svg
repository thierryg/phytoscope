<rect x="70" y="296" width="376" height="54" rx="5" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1"/>
<rect x="70" y="296" width="5" height="54" rx="2.5" fill="#A8552E"/>
<text x="86" y="313" font-family="Lato, sans-serif" font-size="13.63" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Electrode drift</text>
<text x="86" y="328.0" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Polarization and oxidation of the contact: 10 to 40 % in the</text>
<text x="86" y="338.5" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">first half hour, then a slow drift over days.</text>
<rect x="470" y="296" width="376" height="54" rx="5" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1"/>
<rect x="470" y="296" width="5" height="54" rx="2.5" fill="#B08528"/>
<text x="486" y="313" font-family="Lato, sans-serif" font-size="13.63" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Temperature</text>
<text x="486" y="328.0" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The amplifier gain and the tissue resistance both vary with</text>
<text x="486" y="338.5" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">T°. A day/night cycle reads as a “rhythm”.</text>
<rect x="70" y="358" width="376" height="54" rx="5" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1"/>
<rect x="70" y="358" width="5" height="54" rx="2.5" fill="#2F5E86"/>
<text x="86" y="375" font-family="Lato, sans-serif" font-size="13.63" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Surface moisture</text>
<text x="86" y="390.0" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Dew, rain, fog: the film of water short-circuits the path</text>
<text x="86" y="400.5" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">through the tissue.</text>
<rect x="470" y="358" width="376" height="54" rx="5" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1"/>
<rect x="470" y="358" width="5" height="54" rx="2.5" fill="#3F7D5A"/>
<text x="486" y="375" font-family="Lato, sans-serif" font-size="13.63" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Movement</text>
<text x="486" y="390.0" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Wind, a passing walker, vibration: a micro-movement of the</text>
<text x="486" y="400.5" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">electrode = a large-amplitude artefact.</text>
<rect x="70" y="420" width="376" height="54" rx="5" fill="#FFFFFF" stroke="#D9D9C6" stroke-width="1"/>
<rect x="70" y="420" width="5" height="54" rx="2.5" fill="#6B7A72"/>
<text x="86" y="437" font-family="Lato, sans-serif" font-size="13.63" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Mains coupling</text>
<text x="86" y="452.0" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">50 Hz radiated by the grid and by street lamps. Unfiltered, it</text>
<text x="86" y="462.5" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">aliases into the useful band.</text>
<text x="450" y="500" font-family="Lato, sans-serif" font-size="12.18" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">A signal that is clean in the laboratory becomes, outdoors, a sum in which the biological share is the smallest.</text>
</svg>
