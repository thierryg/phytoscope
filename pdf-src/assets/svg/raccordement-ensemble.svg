<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 976" width="980" height="976">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
 <marker id="ahk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5"
   markerHeight="5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#23302C"/></marker>
 <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#A8552E"/></marker>
 <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#E0C073" stroke-width="2.4"/></pattern>
 <pattern id="hatchb" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#cfe0f2" stroke-width="2.8"/></pattern>
</defs>
<rect width="980" height="976" fill="#FFFFFF"/>
<text x="490.0" y="35.95503184" font-family="Cormorant Garamond, serif" font-size="30.42" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Raccordement d'ensemble</text>
<text x="490.0" y="66.37852031999999" font-family="Lato, sans-serif" font-size="20.47" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The laptop is always required; only the power has two sources</text>
<rect x="30" y="128" width="250" height="132" rx="7" fill="#E9F2EC" stroke="#3F7D5A" stroke-width="1.8"/>
<text x="155.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">THE PLANT</text>
<text x="155.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">a tree, a shrub or a potted plant</text>
<text x="155.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">2 measurement electrodes</text>
<text x="155.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">1 earth electrode</text>
<text x="155.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">in the substrate</text>
<rect x="366" y="128" width="250" height="132" rx="7" fill="#fff" stroke="#0E2A22" stroke-width="2.0"/>
<text x="491.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">THE ENCLOSURE</text>
<text x="491.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">PhytoSense One</text>
<text x="491.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">conditionnement analogique</text>
<text x="491.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">conversion 24 bits</text>
<text x="491.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">horodatage</text>
<rect x="700" y="128" width="250" height="132" rx="7" fill="#EAF1FB" stroke="#2F5E86" stroke-width="1.8"/>
<text x="825.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">L'ORDINATEUR</text>
<text x="825.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">portable — indispensable</text>
<text x="825.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">board settings</text>
<text x="825.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">enregistrement</text>
<text x="825.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">analysis and listening</text>
<line x1="284" y1="194.0" x2="360" y2="194.0" stroke="#3F7D5A" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="620" y1="194.0" x2="694" y2="194.0" stroke="#2F5E86" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="200" y="286" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.8">LIAISON DE MESURE</text>
<text x="200" y="304" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">shielded RG-174 cable · 2 m at most</text>
<text x="200" y="320" font-family="Lato, sans-serif" font-size="16.32" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">3.5 mm TRS jack on J1 — see the next figure</text>
<text x="760" y="286" font-family="Lato, sans-serif" font-size="17.7" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.8">LIAISON DE COMMANDE</text>
<text x="760" y="304" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">a single USB-C cable</text>
<text x="760" y="320" font-family="Lato, sans-serif" font-size="16.32" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">measurement data and 5 V in the same lead</text>
<rect x="30" y="378" width="920" height="266" rx="10" fill="#F7F0DC" stroke="#B08528" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="490" y="404" font-family="Lato, sans-serif" font-size="18.25" fill="#B08528" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">WHERE THE POWER COMES FROM — YOUR CHOICE, AND NO BREAK ON CHANGEOVER</text>
<rect x="58" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#3F7D5A" stroke-width="1.7"/>
<text x="190.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A · PAR L'USB</text>
<text x="190.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">the simplest</text>
<text x="190.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">A single cable for everything.</text>
<text x="190.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">500 mA disponibles,</text>
<text x="190.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">137 mA drawn.</text>
<text x="190.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Drains the laptop's</text>
<text x="190.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">laptop over a long session.</text>
<rect x="358" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#A8552E" stroke-width="1.7"/>
<text x="490.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">B · BLOC EXTERNE</text>
<text x="490.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">prioritaire</text>
<text x="490.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Mains adapter 7 to 24 V</text>
<text x="490.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">on socket J30.</text>
<text x="490.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Relieves the laptop and</text>
<text x="490.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">keeps its noisy 5 V away</text>
<text x="490.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">from the measurement chain.</text>
<rect x="658" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#2F5E86" stroke-width="1.7"/>
<text x="790.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">C · ACCUMULATEUR</text>
<text x="790.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">loin de toute prise</text>
<text x="790.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Li-Po 3,7 V 2 000 mAh</text>
<text x="790.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">and its charging module.</text>
<text x="790.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Draws nothing from the laptop</text>
<text x="790.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">nor from the mains — useful</text>
<text x="790.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">for a session in the forest.</text>
<line x1="490" y1="372" x2="490" y2="270" stroke="#B08528" stroke-width="2.6" marker-end="url(#ahv)"/>
<rect x="30" y="674" width="920" height="160" rx="5" fill="#F7F0DC" stroke="#B08528" stroke-width="1.1"/>
<text x="44" y="702" font-family="Lato, sans-serif" font-size="19.08" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">RULE — THE POWER IS DOUBLE, THE LINK IS NOT</text>
<text x="44" y="726" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">All three sources may be present at once. The U62 selector gives priority</text>
<text x="44" y="748" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">to the external adapter, then to USB, and switches between them in under twenty</text>
<text x="44" y="770" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">microseconds: you can unplug the computer from the mains mid-session without losing a</text>
<text x="44" y="792" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sample. None of the three does away with the computer, which remains the only</text>
<text x="44" y="814" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">recipient of the measurement stream.</text>
<rect x="30" y="842" width="920" height="116" rx="5" fill="#FBEEE6" stroke="#A8552E" stroke-width="1.1"/>
<text x="44" y="870" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">SAFETY</text>
<text x="44" y="894" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Never connect anything to the mains but a CE-marked power supply, double-insulated</text>
<text x="44" y="916" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">and at safety extra-low voltage. No part of the board is designed for mains</text>
<text x="44" y="938" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">voltage, and none should be.</text>
<text x="28" y="968" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
<text x="952" y="968" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">bretagne-namaste.com</text>
</svg>
