   <line x1="0" y1="0" x2="0" y2="7" stroke="#cfe0f2" stroke-width="2.8"/></pattern>
</defs>
<rect width="980" height="976" fill="#FFFFFF"/>
<text x="490.0" y="35.95503184" font-family="Cormorant Garamond, serif" font-size="30.42" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Raccordement d'ensemble</text>
<text x="490.0" y="66.37852031999999" font-family="Lato, sans-serif" font-size="20.47" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">L'ordinateur portable est toujours requis ; seule l'énergie a deux provenances</text>
<rect x="30" y="128" width="250" height="132" rx="7" fill="#E9F2EC" stroke="#3F7D5A" stroke-width="1.8"/>
<text x="155.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">LA PLANTE</text>
<text x="155.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">arbre, arbuste ou plante en pot</text>
<text x="155.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">2 électrodes de mesure</text>
<text x="155.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">1 électrode de terre</text>
<text x="155.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">dans le substrat</text>
<rect x="366" y="128" width="250" height="132" rx="7" fill="#fff" stroke="#0E2A22" stroke-width="2.0"/>
<text x="491.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">LE BOÎTIER</text>
<text x="491.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">PhytoSense One</text>
<text x="491.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">conditionnement analogique</text>
<text x="491.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">conversion 24 bits</text>
<text x="491.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">horodatage</text>
<rect x="700" y="128" width="250" height="132" rx="7" fill="#EAF1FB" stroke="#2F5E86" stroke-width="1.8"/>
<text x="825.0" y="160" font-family="Cormorant Garamond, serif" font-size="22.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">L'ORDINATEUR</text>
<text x="825.0" y="180" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">portable — indispensable</text>
<text x="825.0" y="206" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">réglage de la carte</text>
<text x="825.0" y="225" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">enregistrement</text>
<text x="825.0" y="244" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">analyse et écoute</text>
<line x1="284" y1="194.0" x2="360" y2="194.0" stroke="#3F7D5A" stroke-width="2.4" marker-end="url(#ah)"/>
<line x1="620" y1="194.0" x2="694" y2="194.0" stroke="#2F5E86" stroke-width="2.4" marker-end="url(#ah)"/>
<text x="200" y="286" font-family="Lato, sans-serif" font-size="17.7" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.8">LIAISON DE MESURE</text>
<text x="200" y="304" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">câble blindé RG-174 · 2 m au plus</text>
<text x="200" y="320" font-family="Lato, sans-serif" font-size="16.32" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">jack TRS 3,5 mm sur J1 — voir figure suivante</text>
<text x="760" y="286" font-family="Lato, sans-serif" font-size="17.7" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.8">LIAISON DE COMMANDE</text>
<text x="760" y="304" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">un seul câble USB-C</text>
<text x="760" y="320" font-family="Lato, sans-serif" font-size="16.32" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">données de mesure et 5 V dans le même cordon</text>
<rect x="30" y="378" width="920" height="266" rx="10" fill="#F7F0DC" stroke="#B08528" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="490" y="404" font-family="Lato, sans-serif" font-size="18.25" fill="#B08528" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">D'OÙ VIENT L'ÉNERGIE — AU CHOIX, ET SANS COUPURE AU PASSAGE</text>
<rect x="58" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#3F7D5A" stroke-width="1.7"/>
<text x="190.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A · PAR L'USB</text>
<text x="190.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">le plus simple</text>
<text x="190.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Un seul câble pour tout.</text>
<text x="190.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">500 mA disponibles,</text>
<text x="190.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">137 mA consommés.</text>
<text x="190.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Vide la batterie du</text>
<text x="190.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">portable en séance longue.</text>
<rect x="358" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#A8552E" stroke-width="1.7"/>
<text x="490.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">B · BLOC EXTERNE</text>
<text x="490.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">prioritaire</text>
<text x="490.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Bloc secteur 7 à 24 V</text>
<text x="490.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">sur la prise J30.</text>
<text x="490.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Soulage le portable et</text>
<text x="490.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">écarte son 5 V bruyant</text>
<text x="490.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">de la chaîne de mesure.</text>
<rect x="658" y="424" width="264" height="192" rx="7" fill="#fff" stroke="#2F5E86" stroke-width="1.7"/>
<text x="790.0" y="456" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">C · ACCUMULATEUR</text>
<text x="790.0" y="476" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">loin de toute prise</text>
<text x="790.0" y="502" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Li-Po 3,7 V 2 000 mAh</text>
<text x="790.0" y="521" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">et son module de charge.</text>
<text x="790.0" y="540" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Ne tire rien du portable</text>
<text x="790.0" y="559" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">ni du secteur — utile</text>
<text x="790.0" y="578" font-family="Lato, sans-serif" font-size="16.87" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">pour une séance en forêt.</text>
<line x1="490" y1="372" x2="490" y2="270" stroke="#B08528" stroke-width="2.6" marker-end="url(#ahv)"/>
<rect x="30" y="674" width="920" height="160" rx="5" fill="#F7F0DC" stroke="#B08528" stroke-width="1.1"/>
<text x="44" y="702" font-family="Lato, sans-serif" font-size="19.08" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">RÈGLE — L'ÉNERGIE EST DOUBLE, LA LIAISON NE L'EST PAS</text>
<text x="44" y="726" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Les trois provenances peuvent être présentes en même temps. L'aiguilleur U62 donne la</text>
<text x="44" y="748" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">priorité au bloc externe, puis à l'USB, et bascule de l'une à l'autre en moins de vingt</text>
<text x="44" y="770" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">microsecondes : on débranche l'ordinateur du secteur en pleine séance sans perdre un</text>
<text x="44" y="792" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">échantillon. Aucune des trois ne dispense de l'ordinateur, qui reste le seul</text>
<text x="44" y="814" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">destinataire du flux de mesure.</text>
<rect x="30" y="842" width="920" height="116" rx="5" fill="#FBEEE6" stroke="#A8552E" stroke-width="1.1"/>
<text x="44" y="870" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">SÉCURITÉ</text>
<text x="44" y="894" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ne jamais relier au secteur autre chose qu'un bloc d'alimentation marqué CE, à double</text>
<text x="44" y="916" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">isolation et à très basse tension de sécurité. Aucune partie de la carte n'est prévue</text>
<text x="44" y="938" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">pour la tension du réseau, et aucune ne doit l'être.</text>
<text x="28" y="968" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
<text x="952" y="968" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">bretagne-namaste.com</text>
</svg>
