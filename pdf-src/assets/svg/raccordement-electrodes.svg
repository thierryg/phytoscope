<text x="104" y="552" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">mesure — sous une feuille</text>
<circle cx="58" cy="572" r="6" fill="#2F5E86" stroke="none" stroke-width="0"/>
<text x="74" y="576" font-family="Lato, sans-serif" font-size="17.15" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">E2</text>
<text x="104" y="576" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">référence — tronc, 10 à 30 cm plus bas</text>
<circle cx="58" cy="596" r="6" fill="#0E2A22" stroke="none" stroke-width="0"/>
<text x="74" y="600" font-family="Lato, sans-serif" font-size="17.15" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">E3</text>
<text x="104" y="600" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">terre — tige inox 316L dans le substrat</text>
<rect x="500" y="110" width="450" height="250" rx="10" fill="#fff" stroke="#0E2A22" stroke-width="1.6"/>
<text x="725" y="136" font-family="Lato, sans-serif" font-size="18.25" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">LE CÂBLE</text>
<rect x="522" y="243" width="160" height="38" rx="4" fill="#D7D7C6" stroke="#23302C" stroke-width="1.3"/>
<rect x="682" y="249" width="68" height="26" rx="3" fill="#6FA98A" stroke="#3F7D5A" stroke-width="1.3"/>
<rect x="750" y="254" width="52" height="16" rx="2" fill="#FBF9F1" stroke="#23302C" stroke-width="1.1"/>
<line x1="802" y1="262" x2="862" y2="262" stroke="#A8552E" stroke-width="4.0" stroke-linecap="round"/>
<line x1="602" y1="284" x2="602" y2="302" stroke="#6B7A72" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="602" y="314" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">gaine extérieure</text>
<line x1="716" y1="240" x2="716" y2="236" stroke="#3F7D5A" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="716" y="224" font-family="Lato, sans-serif" font-size="16.59" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">tresse → BAGUE (garde)</text>
<line x1="776" y1="284" x2="776" y2="302" stroke="#6B7A72" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="776" y="314" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">diélectrique</text>
<line x1="832" y1="240" x2="832" y2="212" stroke="#A8552E" stroke-width="0.9" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="832" y="200" font-family="Lato, sans-serif" font-size="16.59" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">âme → POINTE (mesure)</text>
<text x="725" y="336" font-family="DejaVu Sans Mono, monospace" font-size="16.59" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">RG-174 · Belden 8216 · 2 m au plus</text>
<rect x="500" y="384" width="450" height="236" rx="10" fill="#fff" stroke="#B08528" stroke-width="1.6"/>
<text x="725" y="410" font-family="Lato, sans-serif" font-size="18.25" fill="#B08528" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.0">LE CONNECTEUR — J1 · JACK TRS 3,5 mm</text>
<rect x="548" y="442" width="300" height="30" rx="4" fill="#E8E4D6" stroke="#23302C" stroke-width="1.4"/>
<rect x="552" y="446" width="56" height="22" rx="2" fill="#A8552E" stroke="none" stroke-width="0"/>
<rect x="616" y="446" width="78" height="22" rx="2" fill="#3F7D5A" stroke="none" stroke-width="0"/>
<rect x="702" y="446" width="142" height="22" rx="2" fill="#2F5E86" stroke="none" stroke-width="0"/>
<circle cx="848" cy="457" r="15" fill="#E8E4D6" stroke="#23302C" stroke-width="1.4"/>
<rect x="548" y="499" width="16" height="14" rx="2" fill="#A8552E" stroke="none" stroke-width="0"/>
<text x="574" y="510" font-family="Lato, sans-serif" font-size="17.15" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">T · pointe</text>
<text x="676" y="510" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">E1 — électrode de mesure</text>
<rect x="548" y="525" width="16" height="14" rx="2" fill="#3F7D5A" stroke="none" stroke-width="0"/>
<text x="574" y="536" font-family="Lato, sans-serif" font-size="17.15" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">R · bague</text>
<text x="676" y="536" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">garde et tresse du câble</text>
<rect x="548" y="551" width="16" height="14" rx="2" fill="#2F5E86" stroke="none" stroke-width="0"/>
<text x="574" y="562" font-family="Lato, sans-serif" font-size="17.15" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">S · corps</text>
<text x="676" y="562" font-family="Lato, sans-serif" font-size="16.59" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">E2 — électrode de référence</text>
<text x="725" y="600" font-family="Lato, sans-serif" font-size="17.15" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">La tresse va sur la bague, jamais sur le corps.</text>
<rect x="30" y="652" width="920" height="160" rx="5" fill="#E9F2EC" stroke="#3F7D5A" stroke-width="1.1"/>
<text x="44" y="680" font-family="Lato, sans-serif" font-size="19.08" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">CE QU'IL FAUT FAIRE</text>
<text x="44" y="704" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Électrodes Ag/AgCl adhésives d'électrocardiographie : le contact le plus stable, plusieurs</text>
<text x="44" y="726" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">heures sans dérive. Une noisette de gel conducteur sans chlorure prolonge encore la tenue.</text>
<text x="44" y="748" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Sur feuille épaisse ou sur écorce, pince crocodile à mors cuivre garnie d'une éponge humide.</text>
<text x="44" y="770" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Deux électrodes espacées de 10 à 30 cm sur le même individu ; jamais sur deux plantes.</text>
<text x="44" y="792" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Câble de deux mètres au plus, fixé par un serre-câble à vingt centimètres du contact.</text>
<rect x="30" y="832" width="920" height="160" rx="5" fill="#FBEEE6" stroke="#A8552E" stroke-width="1.1"/>
<text x="44" y="860" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">CE QU'IL NE FAUT PAS FAIRE</text>
<text x="44" y="884" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Pas d'aluminium ménager : il s'oxyde en quelques heures et fabrique une pile parasite.</text>
<text x="44" y="906" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Pas d'aiguille plantée dans le tronc : blessure inutile, et le signal n'y gagne rien.</text>
<text x="44" y="928" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Pas de câble non blindé ni de rallonge : chaque mètre nu ajoute le réseau à cinquante hertz.</text>
<text x="44" y="950" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Pas de tresse reliée à la masse du boîtier : c'est la faute la plus fréquente, et elle fait</text>
<text x="44" y="972" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">perdre d'un seul coup tout le bénéfice de l'étage électrométrique.</text>
<text x="28" y="1052" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
<text x="952" y="1052" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">bretagne-namaste.com</text>
