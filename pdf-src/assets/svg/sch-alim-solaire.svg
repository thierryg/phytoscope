<text x="591" y="140" font-family="Lato, sans-serif" font-size="12.22" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">LiFePO₄ 3.2 V</text>
<text x="591" y="155" font-family="Lato, sans-serif" font-size="10.92" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">6 000 mA·h</text>
