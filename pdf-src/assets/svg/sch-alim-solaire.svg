<rect x="680" y="130" width="170" height="138" rx="4" fill="#FBFAF4" stroke="#0E2A22" stroke-width="2.1"/><text x="765.0" y="155" font-family="Cormorant Garamond, serif" font-size="17.55" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">TPS63020</text><text x="765.0" y="171" font-family="Lato, sans-serif" font-size="10.4" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">buck-boost 3.3 V</text><polyline points="654,186 680,186" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="688" y="189.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">VIN</text><polyline points="850,186 876,186" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="842" y="189.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">VOUT</text><polyline points="850,226 876,226" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="842" y="229.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">EN</text>
<polyline points="876,186 940,186" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="940,186 940,173" fill="none" stroke="#A8552E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="926" y1="173" x2="954" y2="173" stroke="#A8552E" stroke-width="2.4"/><text x="940" y="166" font-family="Lato, sans-serif" font-size="10.92" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">+3V3</text>
<polyline points="876,226 920,226" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="926" y="222" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">driven by the MCU:</text>
<text x="926" y="236" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">it cuts the sensors off</text>
<text x="926" y="250" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">during deep sleep</text>
<rect x="50" y="350" width="470" height="163.6" rx="4" fill="#EAF4ED" stroke="#3F7D5A" stroke-width="1.2"/><text x="60" y="368.0" font-family="Lato, sans-serif" font-size="10.66" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">THE ENERGY BUDGET — one reading every 15 min</text><text x="60" y="381.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">idle ................ 15 µA × 899 s  =  13.5 mA·s</text><text x="60" y="395.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">wake + measure ...... 40 mA × 0.9 s  =  36.0 mA·s</text><text x="60" y="408.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">LoRa transmit ....... 120 mA × 0.1 s =  12.0 mA·s</text><text x="60" y="422.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">total per cycle ..................... ≈ 61.5 mA·s</text><text x="60" y="436.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">i.e. 0.0171 mA·h × 96 cycles ≈ 1.64 mA·h / day</text><text x="60" y="449.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text><text x="60" y="463.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A 6,000 mA·h cell would last ≈ 3,600 days with NO</text><text x="60" y="476.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">solar input at all. The real limit is therefore not</text><text x="60" y="490.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the capacity but calendar ageing and</text><text x="60" y="504.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">self-discharge.</text>
<rect x="560" y="350" width="470" height="163.6" rx="4" fill="#FBF0E8" stroke="#A8552E" stroke-width="1.2"/><text x="570" y="368.0" font-family="Lato, sans-serif" font-size="10.66" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">WHY LiFePO₄ RATHER THAN Li-ion</text><text x="570" y="381.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">· 3.2 V nominal: it feeds the 3.3 V over almost</text><text x="570" y="395.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">  the whole discharge, with no boost converter</text><text x="570" y="408.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">· −20 … +60 °C when discharging</text><text x="570" y="422.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">· LFP chemistry: no thermal runaway</text><text x="570" y="436.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text><text x="570" y="449.6" font-family="Lato, sans-serif" font-size="10.66" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">⚠ NEVER CHARGE BELOW 0 °C</text><text x="570" y="463.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Below 0 °C charging plates metallic lithium, and</text><text x="570" y="476.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">does so irreversibly. Put a DS18B20 AGAINST the</text><text x="570" y="490.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">cell and lock the charge out in software:</text><text x="570" y="504.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">it is the commonest mistake of winter stations.</text>
</svg>
