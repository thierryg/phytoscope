e. La vraie limite n'est</text><text x="60" y="490.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">donc pas la capacité mais le vieillissement</text><text x="60" y="504.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">calendaire et l'autodécharge.</text>
