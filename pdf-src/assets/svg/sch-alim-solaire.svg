<text x="385" y="268" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">the MPP point set by a resistive divider</text>
<text x="385" y="283" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">→ set it to 0.76 × the panel's Voc</text>
