mily="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">la cellule et verrouiller la charge par logiciel :</text><text x="570" y="504.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">c'est l'erreur n°1 des stations hivernales.</text>
