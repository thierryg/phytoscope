<text x="155.0" y="136" font-family="Cormorant Garamond, serif" font-size="19.36" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Direction of slope</text>
<text x="155.0" y="156" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">rise or fall</text>
