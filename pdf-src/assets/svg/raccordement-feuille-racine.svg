   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
 <marker id="ahk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5"
   markerHeight="5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#23302C"/></marker>
 <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#A8552E"/></marker>
 <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#E0C073" stroke-width="2.4"/></pattern>
 <pattern id="hatchb" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#cfe0f2" stroke-width="2.8"/></pattern>
</defs>
<rect width="980" height="1310" fill="#FFFFFF"/>
<text x="490.0" y="35.95503184" font-family="Cormorant Garamond, serif" font-size="30.42" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Brancher une feuille et une racine</text>
<text x="490.0" y="66.37852031999999" font-family="Lato, sans-serif" font-size="20.47" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Le montage le plus courant — et le choix de l'électrode de substrat</text>
<rect x="30" y="108" width="470" height="560" rx="10" fill="#E9F2EC" stroke="#3F7D5A" stroke-width="1.4" stroke-dasharray="8 5"/>
<text x="265" y="134" font-family="Lato, sans-serif" font-size="18.25" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">LE MONTAGE, EN COUPE</text>
<path d="M150 430 L 178 620 L 352 620 L 380 430 Z" fill="#E4D9C4" stroke="#9C8A6E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M150 430 L 380 430" fill="none" stroke="#9C8A6E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M158 448 L 182 606 L 348 606 L 372 448 Z" fill="#C2A882" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 430 L 265 250" fill="none" stroke="#3F7D5A" stroke-width="4.0" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 300 C 225 286, 205 262, 202 236" fill="none" stroke="#3F7D5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 336 C 305 322, 326 300, 330 274" fill="none" stroke="#3F7D5A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="rotate(-28,196,228)"><ellipse cx="196" cy="228" rx="34" ry="17" fill="#6FA98A" stroke="#3F7D5A" stroke-width="1.4"/></g>
<g transform="rotate(26,336,266)"><ellipse cx="336" cy="266" rx="34" ry="17" fill="#6FA98A" stroke="#3F7D5A" stroke-width="1.4"/></g>
<path d="M265 432 C 241.0 470, 205 520, 199.0 588" fill="none" stroke="#A58A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 432 C 254.6 470, 239 520, 236.4 588" fill="none" stroke="#A58A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 432 C 265.0 470, 265 520, 265.0 588" fill="none" stroke="#A58A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 432 C 275.4 470, 291 520, 293.6 588" fill="none" stroke="#A58A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M265 432 C 289.0 470, 325 520, 331.0 588" fill="none" stroke="#A58A5E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="196" cy="228" r="9" fill="#A8552E" stroke="#fff" stroke-width="2.0"/>
<line x1="196" y1="228" x2="120" y2="192" stroke="#A8552E" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="52" y="182" font-family="Lato, sans-serif" font-size="19.36" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">E1</text>
<text x="52" y="196" font-family="Lato, sans-serif" font-size="15.49" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">pastille Ag/AgCl</text>
<text x="52" y="208" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sous la feuille</text>
<rect x="316" y="452" width="7" height="118" rx="2" fill="#BFC4C8" stroke="#23302C" stroke-width="1.2"/>
<circle cx="319" cy="452" r="8" fill="#0E2A22" stroke="#fff" stroke-width="2.0"/>
<line x1="319" y1="452" x2="416" y2="396" stroke="#0E2A22" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="484" y="384" font-family="Lato, sans-serif" font-size="19.36" fill="#0E2A22" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">E2</text>
<text x="484" y="398" font-family="Lato, sans-serif" font-size="15.49" fill="#23302C" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">tige inox 316L</text>
<text x="484" y="410" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">3 à 5 cm de profondeur</text>
<line x1="265" y1="640" x2="319" y2="640" stroke="#2F5E86" stroke-width="1.0" stroke-linecap="round"/>
<text x="292" y="656" font-family="Lato, sans-serif" font-size="16.04" fill="#2F5E86" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">≥ 5 cm de la tige</text>
<line x1="330" y1="452" x2="330" y2="570" stroke="#2F5E86" stroke-width="1.0" stroke-linecap="round" stroke-dasharray="3 3"/>
<text x="352" y="516" font-family="Lato, sans-serif" font-size="16.04" fill="#2F5E86" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">3–5 cm</text>
<rect x="30" y="690" width="920" height="138" rx="5" fill="#EAF1FB" stroke="#2F5E86" stroke-width="1.1"/>
<text x="44" y="718" font-family="Lato, sans-serif" font-size="19.08" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">CE QUE MESURE CE MONTAGE</text>
<text x="44" y="742" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">La tension mesurée est celle du chemin feuille → tige → racines → substrat → électrode.</text>
<text x="44" y="764" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Elle ne dit donc pas « la feuille » : elle dit l'ensemble plante + substrat + contacts.</text>
<text x="44" y="786" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Un arrosage la déplace autant qu'un changement de la plante — c'est la limite du montage,</text>
<text x="44" y="808" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">et elle doit être écrite dans le carnet de séance.</text>
<rect x="516" y="108" width="434" height="560" rx="10" fill="#fff" stroke="#0E2A22" stroke-width="1.6"/>
<text x="733" y="134" font-family="Lato, sans-serif" font-size="18.25" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">QUE PLANTER DANS LA TERRE</text>
<circle cx="546" cy="166" r="7" fill="#3F7D5A" stroke="none" stroke-width="0"/>
<text x="546" y="169" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="566" y="164" font-family="Lato, sans-serif" font-size="18.25" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Inox 316L</text>
<text x="566" y="176" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">tige ø 4–6 mm, 60–100 mm</text>
<text x="566" y="188" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le choix par défaut : stable, inerte, increvable.</text>
<circle cx="546" cy="228" r="7" fill="#3F7D5A" stroke="none" stroke-width="0"/>
<text x="546" y="231" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="566" y="226" font-family="Lato, sans-serif" font-size="18.25" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Graphite</text>
<text x="566" y="238" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">mine ø 5 mm ou charbon</text>
<text x="566" y="250" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Peu polarisable, aucun ion métallique. Fragile.</text>
<circle cx="546" cy="290" r="7" fill="#3F7D5A" stroke="none" stroke-width="0"/>
<text x="546" y="293" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="566" y="288" font-family="Lato, sans-serif" font-size="18.25" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Ag/AgCl + pont salin</text>
<text x="566" y="300" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">agar 3 % + KCl 3 mol/L</text>
<text x="566" y="312" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">La référence de laboratoire : dérive minimale.</text>
<circle cx="546" cy="352" r="7" fill="#A8552E" stroke="none" stroke-width="0"/>
<text x="546" y="355" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="566" y="350" font-family="Lato, sans-serif" font-size="18.25" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Laiton, cuivre</text>
<text x="566" y="364" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Pile galvanique avec E1, et toxique pour les racines.</text>
<circle cx="546" cy="414" r="7" fill="#A8552E" stroke="none" stroke-width="0"/>
<text x="546" y="417" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="566" y="412" font-family="Lato, sans-serif" font-size="18.25" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Acier galvanisé</text>
<text x="566" y="426" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le zinc se dissout : décalage énorme et croissant.</text>
<circle cx="546" cy="476" r="7" fill="#A8552E" stroke="none" stroke-width="0"/>
<text x="546" y="479" font-family="Lato, sans-serif" font-size="17.7" fill="#fff" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="566" y="474" font-family="Lato, sans-serif" font-size="18.25" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Aluminium</text>
<text x="566" y="488" font-family="Lato, sans-serif" font-size="16.04" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">S'oxyde en quelques heures ; mesure instable.</text>
<rect x="540" y="548" width="386" height="104" rx="6" fill="#F7F0DC" stroke="#B08528" stroke-width="1.3"/>
<text x="733" y="570" font-family="Lato, sans-serif" font-size="16.59" fill="#B08528" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0.8">LE PONT SALIN, EN DEUX MOTS</text>
<rect x="566" y="584" width="16" height="54" rx="3" fill="#EDE7D4" stroke="#23302C" stroke-width="1.2"/>
<rect x="568" y="592" width="12" height="44" rx="0" fill="#EAF1FB" stroke="none" stroke-width="0"/>
<line x1="574" y1="584" x2="574" y2="566" stroke="#BFC4C8" stroke-width="3.0" stroke-linecap="round"/>
<text x="596" y="596" font-family="Lato, sans-serif" font-size="15.49" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">tube rempli d'agar-agar salé,</text>
<text x="596" y="610" font-family="Lato, sans-serif" font-size="15.49" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">fil d'argent chloruré à l'intérieur,</text>
<text x="596" y="624" font-family="Lato, sans-serif" font-size="15.49" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">l'extrémité seule touche la terre.</text>
<text x="596" y="640" font-family="Lato, sans-serif" font-size="15.49" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Aucun métal ne touche les racines.</text>
<rect x="30" y="852" width="920" height="270" rx="5" fill="#E9F2EC" stroke="#3F7D5A" stroke-width="1.1"/>
<text x="44" y="880" font-family="Lato, sans-serif" font-size="19.08" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">TROIS RÈGLES, ET RIEN DE PLUS</text>
<text x="44" y="904" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">LE MÊME MÉTAL AUX DEUX BOUTS. Deux métaux différents dans un milieu humide font une pile :</text>
<text x="44" y="926" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">on mesure alors sa tension — quelques dizaines de millivolts — et sa dérive avec l'humidité,</text>
<text x="44" y="948" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">bien plus que la plante. Si E1 est une pastille Ag/AgCl, la meilleure E2 est un pont salin ;</text>
<text x="44" y="970" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">à défaut, inox des deux côtés. La ligne de base retire le décalage constant, jamais sa dérive.</text>
<text x="44" y="992" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="44" y="1014" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">SUBSTRAT HUMIDE, jamais détrempé ni sec : sec, l'impédance monte et le bruit avec elle.</text>
<text x="44" y="1036" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Quelques gouttes d'eau avant la séance suffisent — pas d'eau salée, qui brûle les racines.</text>
<text x="44" y="1058" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="44" y="1080" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">MÊME PLACE D'UNE SÉANCE À L'AUTRE si l'on veut comparer : noter la profondeur, la distance</text>
<text x="44" y="1102" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">à la tige et la feuille choisie. Sans cela, deux séances ne se comparent pas.</text>
<rect x="30" y="1146" width="920" height="138" rx="5" fill="#FBEEE6" stroke="#A8552E" stroke-width="1.1"/>
<text x="44" y="1174" font-family="Lato, sans-serif" font-size="19.08" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">CE QU'IL NE FAUT PAS FAIRE</text>
<text x="44" y="1198" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ne jamais planter l'électrode dans le tronc ou dans une racine : la blessure ne se referme</text>
<text x="44" y="1220" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">pas et le signal n'y gagne rien. Ne jamais relier l'électrode de substrat à la terre du</text>
<text x="44" y="1242" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">secteur — ni à la masse du boîtier. Ne jamais employer d'engrais liquide juste avant une</text>
<text x="44" y="1264" font-family="Lato, sans-serif" font-size="17.42" fill="#23302C" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">séance : la conductivité change pendant des heures et masque tout le reste.</text>
<text x="28" y="1302" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
<text x="952" y="1302" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">bretagne-namaste.com</text>
</svg>
