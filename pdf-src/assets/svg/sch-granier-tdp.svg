<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" width="1080" height="700">
<rect width="1080" height="700" fill="#FFFFFF"/>
<rect x="10" y="10" width="1060" height="680" rx="3" fill="none" stroke="#D9D9C6" stroke-width="1.4"/><rect x="748" y="644" width="322" height="46" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.4"/><text x="758" y="663" font-family="Lato, sans-serif" font-size="10.92" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">PLATE 5 — The sap-flow probe (Granier / TDP)</text><text x="758" y="678" font-family="Lato, sans-serif" font-size="9.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">constant heating · a differential thermocouple</text>
<text x="540.0" y="42" font-family="Lato, sans-serif" font-size="16.9" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.5">THERMAL DISSIPATION: A HEATED PROBE AND A REFERENCE PROBE</text>
<circle cx="200" cy="330" r="122" fill="#F2EFE2" stroke="#0E2A22" stroke-width="2"/>
<circle cx="200" cy="330" r="96" fill="#EAF4ED" stroke="#3F7D5A" stroke-width="1.6"/>
<circle cx="200" cy="330" r="54" fill="#E4DFCB" stroke="#6B7A72" stroke-width="1.4"/>
<rect x="195" y="238" width="10" height="44" rx="3" fill="#A8552E" stroke="#23302C" stroke-width="1.4"/>
<rect x="195" y="378" width="10" height="44" rx="3" fill="#2F5E86" stroke="#23302C" stroke-width="1.4"/>
<text x="200" y="150" font-family="Lato, sans-serif" font-size="10.92" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">the HEATED needle — upstream</text>
<text x="200" y="490" font-family="Lato, sans-serif" font-size="10.92" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">the REFERENCE needle — downstream, unheated</text>
<text x="200" y="512" font-family="Lato, sans-serif" font-size="9.88" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">cross-section · both needles on the same vertical,</text>
<text x="200" y="526" font-family="Lato, sans-serif" font-size="9.88" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">40 mm apart, inserted 20 mm</text>
<rect x="40" y="556" width="320" height="86" rx="4" fill="#FBFAF4" stroke="#D9D9C6" stroke-width="1.2"/>
<rect x="56" y="571" width="16" height="14" rx="2" fill="#F2EFE2" stroke="#6B7A72" stroke-width="1"/>
<text x="82" y="582" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">bark + phloem</text>
<rect x="56" y="593" width="16" height="14" rx="2" fill="#EAF4ED" stroke="#6B7A72" stroke-width="1"/>
<text x="82" y="604" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sapwood — the only conducting tissue</text>
<rect x="56" y="615" width="16" height="14" rx="2" fill="#E4DFCB" stroke="#6B7A72" stroke-width="1"/>
<text x="82" y="626" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">heartwood — hydraulically dead</text>
<polyline points="200,238 200,172 470,172" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="470" y="163.5" width="92" height="17" rx="1.5" fill="#FFFFFF" stroke="#23302C" stroke-width="1.7"/><text x="516.0" y="156.5" font-family="Lato, sans-serif" font-size="10.92" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">R_ch</text><text x="516.0" y="196.5" font-family="Lato, sans-serif" font-size="10.92" fill="#0E2A22" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">≈ 25 Ω · 0.2 W constant</text>
<polyline points="562,172 650,172" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="650,172 650,159" fill="none" stroke="#A8552E" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><line x1="636" y1="159" x2="664" y2="159" stroke="#A8552E" stroke-width="2.4"/><text x="650" y="152" font-family="Lato, sans-serif" font-size="10.92" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">+5 V regulated</text>
<text x="516" y="134" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">heating cartridge</text>
<polyline points="205,260 372,260 372,300 494,300" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="205,400 420,400 420,340 494,340" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<text x="384" y="232" font-family="Lato, sans-serif" font-size="9.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">constantan / copper —</text>
<text x="384" y="246" font-family="Lato, sans-serif" font-size="9.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the differential junction</text>
<rect x="520" y="242" width="170" height="140" rx="4" fill="#FBFAF4" stroke="#0E2A22" stroke-width="2.1"/><text x="605.0" y="267" font-family="Cormorant Garamond, serif" font-size="17.55" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">ADS1220</text><text x="605.0" y="283" font-family="Lato, sans-serif" font-size="10.4" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">ΔΣ 24-bit · PGA ×128</text><polyline points="494,300 520,300" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="303.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">AIN0</text><polyline points="494,340 520,340" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="528" y="343.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">AIN1</text><polyline points="690,320 716,320" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><text x="682" y="323.6" font-family="Lato, sans-serif" font-size="11.18" fill="#0E2A22" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">SPI</text>
<polyline points="716,320 778,320" fill="none" stroke="#23302C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="778" y="288" width="146" height="64" rx="5" fill="#F2F7FB" stroke="#2F5E86" stroke-width="2"/>
<text x="851" y="316" font-family="Cormorant Garamond, serif" font-size="15.6" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">ESP32</text>
<text x="851" y="334" font-family="Lato, sans-serif" font-size="10.14" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">one reading / 10 min</text>
<rect x="400" y="416" width="400" height="68.4" rx="4" fill="#F5F8FB" stroke="#2F5E86" stroke-width="1.2"/><text x="410" y="434.0" font-family="Lato, sans-serif" font-size="10.66" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">THE GRANIER EQUATION (1985)</text><text x="410" y="447.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">K = (ΔT_max − ΔT) / ΔT</text><text x="410" y="461.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">u = 118,99·10⁻⁶ · K^1,231       [m³ m⁻² s⁻¹]</text><text x="410" y="474.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ΔT_max = the gap measured at zero flow, at the end of the night.</text>
<rect x="400" y="500" width="400" height="109.2" rx="4" fill="#FBF0E8" stroke="#A8552E" stroke-width="1.2"/><text x="410" y="518.0" font-family="Lato, sans-serif" font-size="10.66" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">⚠ THE ORIGINAL CALIBRATION IS BIASED</text><text x="410" y="531.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The literature documents an underestimate of 30 to 60 %</text><text x="410" y="545.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">of the real flow, depending on the species and the depth of</text><text x="410" y="558.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">insertion. Without recalibrating per species, this circuit</text><text x="410" y="572.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">does NOT give an absolute flow rate: it gives a relative</text><text x="410" y="586.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">INDEX, to be read only within its own day / night</text><text x="410" y="599.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">dynamics, on one tree and one season.</text>
<rect x="824" y="416" width="228" height="122.8" rx="4" fill="#EAF4ED" stroke="#3F7D5A" stroke-width="1.2"/><text x="834" y="434.0" font-family="Lato, sans-serif" font-size="10.66" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">THE METROLOGICAL CONSTRAINT</text><text x="834" y="447.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The useful gradient runs from 0 to 10 K.</text><text x="834" y="461.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">It has to resolve 0.01 K, about</text><text x="834" y="474.8" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">0.4 µV across a type-T</text><text x="834" y="488.4" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">copper-constantan (≈ 40 µV/K).</text><text x="834" y="502.0" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Hence 24 bits AND a PGA ×128:</text><text x="834" y="515.6" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a 12-bit ADC built into the MCU</text><text x="834" y="529.2" font-family="Lato, sans-serif" font-size="10.66" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">is out of the question here.</text>
</svg>
