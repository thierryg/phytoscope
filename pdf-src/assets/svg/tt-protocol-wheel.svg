<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 620" width="760" height="620">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="760" height="620" fill="#FBF9F1"/>
<text x="380" y="36" font-family="Cormorant Garamond, serif" font-size="16.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.2">AN OBSERVATION PROTOCOL IN SEVEN SITTINGS</text>
<text x="380" y="57" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The same hour, the same tree, seven times</text>
<circle cx="380" cy="330" r="190" fill="none" stroke="#D9D9C6" stroke-width="1.6"/>
<circle cx="380" cy="330" r="72" fill="#0E2A22"/>
<text x="380" y="322" font-family="Cormorant Garamond, serif" font-size="14.5" fill="#E0C073" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.4">TREE</text>
<text x="380" y="340" font-family="Cormorant Garamond, serif" font-size="14.5" fill="#E0C073" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.4">CONTROL</text>
<text x="380" y="360" font-family="Lato, sans-serif" font-size="9.86" fill="#9FB8AB" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">the same one, always</text>
<line x1="380" y1="256" x2="380" y2="164" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="380" cy="140" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="380.0" y="146.0" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">1</text>
<text x="380.0" y="92.0" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Reconnaissance</text>
<text x="380.0" y="106.0" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">No instrument. Describe the place,</text>
<text x="380.0" y="116.5" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">the tree, the light, the soil.</text>
<line x1="438" y1="284" x2="510" y2="227" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="529" cy="212" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="528.5479816689257" y="217.53693764684064" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">2</text>
<text x="558.5479816689257" y="180.85640676133892" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Calibration</text>
<text x="558.5479816689257" y="194.85640676133892" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Fit the sensors, let them settle</text>
<text x="558.5479816689257" y="205.35640676133892" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">for 2 h, interpret nothing.</text>
<line x1="452" y1="346" x2="542" y2="367" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="565" cy="372" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="565.2363033145465" y="378.27897745169975" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">3</text>
<text x="595.2363033145465" y="380.5149404136902" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Reference</text>
<text x="595.2363033145465" y="394.5149404136902" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Record a whole day without</text>
<text x="595.2363033145465" y="405.0149404136902" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">intervening. This is the control.</text>
<line x1="412" y1="397" x2="452" y2="480" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="462" cy="501" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="462.437910432336" y="507.18408490145964" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">4</text>
<text x="492.437910432336" y="540.6286528249709" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">A gentle disturbance</text>
<text x="492.437910432336" y="554.6286528249709" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A measured watering. Note the</text>
<text x="492.437910432336" y="565.1286528249709" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">exact time before looking.</text>
<line x1="348" y1="397" x2="308" y2="480" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="298" cy="501" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="297.562089567664" y="507.18408490145964" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">5</text>
<text x="267.562089567664" y="540.6286528249709" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">Presence</text>
<text x="267.562089567664" y="554.6286528249709" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">Stay 40 min near the tree. Record</text>
<text x="267.562089567664" y="565.1286528249709" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">your perceptions blind.</text>
<line x1="308" y1="346" x2="218" y2="367" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="195" cy="372" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="194.7636966854535" y="378.27897745169975" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">6</text>
<text x="164.7636966854535" y="380.5149404136902" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">Counter-test</text>
<text x="164.7636966854535" y="394.5149404136902" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">The same protocol, with the sensor</text>
<text x="164.7636966854535" y="405.0149404136902" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">on an inert support.</text>
<line x1="322" y1="284" x2="250" y2="227" stroke="#D9D9C6" stroke-width="1.3"/>
<circle cx="231" cy="212" r="23" fill="#B08528" stroke="#FBF9F1" stroke-width="2.4"/>
<text x="231.45201833107433" y="217.53693764684067" font-family="Cormorant Garamond, serif" font-size="18.85" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">7</text>
<text x="201.45201833107433" y="180.85640676133895" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="end" font-weight="700" font-style="normal" letter-spacing="0">Confrontation</text>
<text x="201.45201833107433" y="194.85640676133895" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">Lay the three journals over one</text>
<text x="201.45201833107433" y="205.35640676133895" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">another. Look for what does not</text>
<text x="201.45201833107433" y="215.85640676133895" font-family="Lato, sans-serif" font-size="10.01" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">fit.</text>
<text x="380" y="598" font-family="Lato, sans-serif" font-size="11.89" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Sitting 6 is the one everybody skips. It is the only one that can prove you wrong.</text>
</svg>
