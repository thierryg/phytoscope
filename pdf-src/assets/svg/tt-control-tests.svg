<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="900" height="480" fill="#FBF9F1"/>
<text x="450" y="34" font-family="Cormorant Garamond, serif" font-size="18.12" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.6">THE THREE TESTS THAT DECIDE EVERYTHING</text>
<text x="450" y="55" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">To be run before any public showing — and published with the result</text>
<rect x="40" y="86" width="260" height="322" rx="9" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.8"/>
<circle cx="74" cy="118" r="19" fill="#A8552E"/>
<text x="74" y="125" font-family="Cormorant Garamond, serif" font-size="23.2" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">1</text>
<text x="102" y="124" font-family="Lato, sans-serif" font-size="13.92" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">THE EMPTY TEST</text>
<line x1="58" y1="148" x2="282" y2="148" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="58" y="170" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Unclip the electrode. Put it on</text>
<text x="58" y="185" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a bottle of water. Feed white</text>
<text x="58" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">noise in where the signal</text>
<text x="58" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">used to be.</text>
<rect x="58" y="244" width="224" height="44" rx="4" fill="#FBFAF4" stroke="#A8552E" stroke-width="1.1"/>
<text x="170" y="262" font-family="Lato, sans-serif" font-size="11.6" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The system must produce visible</text>
<text x="170" y="274" font-family="Lato, sans-serif" font-size="11.6" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">nonsense.</text>
<text x="170" y="306" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">If it still produces fine sentences,</text>
<text x="170" y="318" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">they were never coming from the</text>
<text x="170" y="330" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">plant.</text>
<rect x="320" y="86" width="260" height="322" rx="9" fill="#FFFFFF" stroke="#2F5E86" stroke-width="1.8"/>
<circle cx="354" cy="118" r="19" fill="#2F5E86"/>
<text x="354" y="125" font-family="Cormorant Garamond, serif" font-size="23.2" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">2</text>
<text x="382" y="124" font-family="Lato, sans-serif" font-size="13.92" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">THE ABLATION</text>
<line x1="338" y1="148" x2="562" y2="148" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="338" y="170" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Replace the signal with a random</text>
<text x="338" y="185" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">draw from the same vocabulary.</text>
<text x="338" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Play both versions to a listener,</text>
<text x="338" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">blind.</text>
<rect x="338" y="244" width="224" height="44" rx="4" fill="#FBFAF4" stroke="#2F5E86" stroke-width="1.1"/>
<text x="450" y="262" font-family="Lato, sans-serif" font-size="11.6" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">A listener has to be able to</text>
<text x="450" y="274" font-family="Lato, sans-serif" font-size="11.6" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">tell them apart.</text>
<text x="450" y="306" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Otherwise the signal adds nothing:</text>
<text x="450" y="318" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">that is the result of Tan et al.,</text>
<text x="450" y="330" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">NeurIPS 2024.</text>
<rect x="600" y="86" width="260" height="322" rx="9" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.8"/>
<circle cx="634" cy="118" r="19" fill="#3F7D5A"/>
<text x="634" y="125" font-family="Cormorant Garamond, serif" font-size="23.2" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">3</text>
<text x="662" y="124" font-family="Lato, sans-serif" font-size="13.92" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.2">PRE-REGISTRATION</text>
<line x1="618" y1="148" x2="842" y2="148" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="618" y="170" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Write down, before the sitting:</text>
<text x="618" y="185" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the vocabulary, the threshold, the</text>
<text x="618" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">listening window, the duration. Timestamp it.</text>
<text x="618" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">No editing afterwards.</text>
<rect x="618" y="244" width="224" height="44" rx="4" fill="#FBFAF4" stroke="#3F7D5A" stroke-width="1.1"/>
<text x="730" y="262" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The protocol comes before the</text>
<text x="730" y="274" font-family="Lato, sans-serif" font-size="11.6" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">data.</text>
<text x="730" y="306" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">This is what forbids picking, after</text>
<text x="730" y="318" font-family="Lato, sans-serif" font-size="10.44" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">the fact, the passage that “speaks”.</text>
<rect x="40" y="424" width="820" height="42" rx="6" fill="#0E2A22"/>
<text x="450" y="442" font-family="Lato, sans-serif" font-size="13.63" fill="#E0C073" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">An installation that does not publish its failure conditions publishes nothing.</text>
<text x="450" y="458" font-family="Lato, sans-serif" font-size="11.31" fill="#9FB8AB" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">These three tests do not destroy the work: they make it defensible.</text>
</svg>
