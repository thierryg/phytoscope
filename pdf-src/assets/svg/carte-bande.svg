<text x="90" y="424" font-family="Lato, sans-serif" font-size="17.7" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Sampling: 250 Hz by default, 1 kHz in oscilloscope mode, 32 kHz for direct listening.</text>
<text x="90" y="444" font-family="Lato, sans-serif" font-size="17.15" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Mains hum is removed digitally: no phase shift is added in the useful band.</text>
