<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 520" width="840" height="520">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="840" height="520" fill="#FBF9F1"/>
<text x="420" y="36" font-family="Cormorant Garamond, serif" font-size="18.12" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="3">L'ÉCHELLE ÉPISTÉMIQUE</text>
<text x="420" y="57" font-family="Lato, sans-serif" font-size="12.18" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Quatre registres qu'il ne faut jamais faire glisser l'un dans l'autre</text>
<rect x="70" y="92" width="700" height="84" rx="7" fill="#FFFFFF" stroke="#2F7D5E" stroke-width="1.8"/>
<rect x="70" y="92" width="8" height="84" rx="4" fill="#2F7D5E"/>
<text x="96" y="116" font-family="Lato, sans-serif" font-size="15.37" fill="#2F7D5E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="2">MESURE</text>
<text x="96" y="137" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">« La tension entre deux points du tronc a varié de 7 mV en 40 minutes. »</text>
<text x="96" y="155.0" font-family="Lato, sans-serif" font-size="10.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Reproductible par quiconque dispose du même appareil. Chiffrée, datée, incertitude connue.</text>
<path d="M420,178 l0,14" stroke="#D9D9C6" stroke-width="1.6"/>
<text x="438" y="191" font-family="Lato, sans-serif" font-size="10.15" fill="#A8552E" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">↓ le glissement commence ici</text>
<rect x="70" y="192" width="700" height="84" rx="7" fill="#FFFFFF" stroke="#2F5E86" stroke-width="1.8"/>
<rect x="70" y="192" width="8" height="84" rx="4" fill="#2F5E86"/>
<text x="96" y="216" font-family="Lato, sans-serif" font-size="15.37" fill="#2F5E86" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="2">FAIT ÉTABLI</text>
<text x="96" y="237" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">« Les plantes propagent des signaux électriques sur de longues distances. »</text>
<text x="96" y="255.0" font-family="Lato, sans-serif" font-size="10.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Publié, répliqué, mécanisme identifié. Révisable, mais solidement adossé.</text>
<path d="M420,278 l0,14" stroke="#D9D9C6" stroke-width="1.6"/>
<text x="438" y="291" font-family="Lato, sans-serif" font-size="10.15" fill="#A8552E" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">↓ le glissement commence ici</text>
<rect x="70" y="292" width="700" height="84" rx="7" fill="#FFFFFF" stroke="#B08528" stroke-width="1.8"/>
<rect x="70" y="292" width="8" height="84" rx="4" fill="#B08528"/>
<text x="96" y="316" font-family="Lato, sans-serif" font-size="15.37" fill="#B08528" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="2">HYPOTHÈSE</text>
<text x="96" y="337" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">« Ce signal pourrait coder l'état hydrique de l'arbre. »</text>
<text x="96" y="355.0" font-family="Lato, sans-serif" font-size="10.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Formulée pour être testée. Prédit quelque chose de falsifiable. Pas encore tranchée.</text>
<path d="M420,378 l0,14" stroke="#D9D9C6" stroke-width="1.6"/>
<text x="438" y="391" font-family="Lato, sans-serif" font-size="10.15" fill="#A8552E" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">↓ le glissement commence ici</text>
<rect x="70" y="392" width="700" height="84" rx="7" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.8"/>
<rect x="70" y="392" width="8" height="84" rx="4" fill="#A8552E"/>
<text x="96" y="416" font-family="Lato, sans-serif" font-size="15.37" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="2">INTERPRÉTATION</text>
<text x="96" y="437" font-family="Lato, sans-serif" font-size="13.34" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">« L'arbre exprime sa soif. »</text>
<text x="96" y="455.0" font-family="Lato, sans-serif" font-size="10.88" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Donne du sens à l'expérience. Légitime comme récit, nulle comme preuve. Non falsifiable.</text>
<text x="420" y="500" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Chaque affirmation de cet ouvrage est rattachée explicitement à l'un de ces quatre barreaux.</text>
</svg>
