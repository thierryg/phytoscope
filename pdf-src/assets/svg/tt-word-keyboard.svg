<text x="450" y="330" font-family="Lato, sans-serif" font-size="12.18" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">≈ 50 mots, choisis par l'opérateur, un par touche</text>
<path d="M779,156 v26 H450" fill="none" stroke="#A8552E" stroke-width="2.2"/>
<line x1="450" y1="182" x2="450" y2="208" stroke="#A8552E" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="348" width="370" height="132" rx="7" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.6"/>
<text x="245" y="370" font-family="Lato, sans-serif" font-size="13.34" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">CE QUE CELA CHANGE</text>
<text x="80" y="390" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le signal est inchangé : mêmes</text>
<text x="80" y="403" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">variations, même appareil, même</text>
<text x="80" y="416" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">seuil. Seule la banque de sons</text>
<text x="80" y="429" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a été remplacée.</text>
<text x="80" y="442" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="80" y="455" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Aucune information nouvelle</text>
<text x="80" y="468" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">n'entre dans le système.</text>
<rect x="470" y="348" width="370" height="132" rx="7" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.6"/>
<text x="655" y="370" font-family="Lato, sans-serif" font-size="13.34" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">CE QUE CELA DÉPLACE</text>
<text x="490" y="390" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Une note n'a pas de référent ;</text>
<text x="490" y="403" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">un mot en a un. L'auditeur</text>
<text x="490" y="416" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">fournit désormais le sens.</text>
<text x="490" y="429" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="490" y="442" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">La charge interprétative migre</text>
<text x="490" y="455" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">de l'appareil vers l'humain —</text>
<text x="490" y="468" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">et devient invisible.</text>
