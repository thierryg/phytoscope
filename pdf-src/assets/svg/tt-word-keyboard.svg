<path d="M779,156 v26 H450" fill="none" stroke="#A8552E" stroke-width="2.2"/>
<line x1="450" y1="182" x2="450" y2="208" stroke="#A8552E" stroke-width="2.2" marker-end="url(#ah)"/>
<rect x="60" y="348" width="370" height="132" rx="7" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.6"/>
<text x="245" y="370" font-family="Lato, sans-serif" font-size="13.34" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">WHAT THIS CHANGES</text>
<text x="80" y="390" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The signal is unchanged: the same</text>
<text x="80" y="403" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">variations, the same instrument, the</text>
<text x="80" y="416" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">same threshold. Only the sound bank</text>
<text x="80" y="429" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">has been swapped.</text>
<text x="80" y="442" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="80" y="455" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">No new information enters</text>
<text x="80" y="468" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the system at all.</text>
<rect x="470" y="348" width="370" height="132" rx="7" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.6"/>
<text x="655" y="370" font-family="Lato, sans-serif" font-size="13.34" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.6">WHAT THIS SHIFTS</text>
<text x="490" y="390" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A note has no referent;</text>
<text x="490" y="403" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a word has one. The listener now</text>
<text x="490" y="416" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">supplies the meaning.</text>
<text x="490" y="429" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="490" y="442" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The interpretive load migrates</text>
<text x="490" y="455" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">from the instrument to the human —</text>
<text x="490" y="468" font-family="Lato, sans-serif" font-size="11.02" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">and becomes invisible.</text>
</svg>
