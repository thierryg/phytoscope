<text x="450" y="55" font-family="Lato, sans-serif" font-size="11.89" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Remplacer les notes par des mots : le geste, et ce qu'il déplace</text>
