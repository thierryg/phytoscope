<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="880" height="470" fill="#FBF9F1"/>
<text x="440" y="34" font-family="Cormorant Garamond, serif" font-size="16.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.2">DEUX « TALKING TREES », QUINZE ANS D'ÉCART</text>
<rect x="80" y="66" width="330" height="46" rx="7" fill="#A8552E"/>
<text x="245" y="86" font-family="Lato, sans-serif" font-size="13.63" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.4">BRUXELLES · 2010</text>
<text x="245" y="102" font-family="Lato, sans-serif" font-size="10.73" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Happiness Brussels, pour le magazine EOS</text>
<rect x="470" y="66" width="330" height="46" rx="7" fill="#2F5E86"/>
<text x="635" y="86" font-family="Lato, sans-serif" font-size="13.63" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.4">LONDRES · AUSTIN · DUBLIN · 2025</text>
<text x="635" y="102" font-family="Lato, sans-serif" font-size="10.73" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Droga5, pour Agency for Nature</text>
<rect x="80" y="130" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="150" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Arbre</text>
<text x="236" y="148" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Un arbre centenaire, à Bruxelles.</text>
<text x="560" y="148" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Trois arbres successifs : 150, 50 et 200</text>
<text x="560" y="159" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ans.</text>
<line x1="80" y1="178" x2="800" y2="178" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="178" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="198" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Capteurs</text>
<text x="236" y="196" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ozone, particules fines, luxmètre, station</text>
<text x="236" y="207" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">météo, webcam, microphone.</text>
<text x="560" y="196" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Une dizaine : bioélectrique, sol, air,</text>
<text x="560" y="207" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">lumière, vent.</text>
<line x1="80" y1="226" x2="800" y2="226" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="226" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="246" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Traitement</text>
<text x="236" y="244" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Logiciel sur mesure : des règles fixes</text>
<text x="236" y="255" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">produisent un message.</text>
<text x="560" y="244" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Modèle de langage exécuté hors ligne sur un</text>
<text x="560" y="255" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Mac Mini.</text>
<line x1="80" y1="274" x2="800" y2="274" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="274" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="294" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Voix</text>
<text x="236" y="292" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Publications différées sur Facebook,</text>
<text x="236" y="303" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Twitter, Flickr, SoundCloud.</text>
<text x="560" y="292" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Dialogue vocal en direct : le visiteur</text>
<text x="560" y="303" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">s'assoit et parle.</text>
<line x1="80" y1="322" x2="800" y2="322" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="322" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="342" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Ce qui vient de l'humain</text>
<text x="236" y="340" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Chaque phrase, écrite à l'avance.</text>
<text x="560" y="340" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le rôle, les contraintes, et tout le style.</text>
<line x1="80" y1="370" x2="800" y2="370" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="370" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="390" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Vérifiabilité</text>
<text x="236" y="388" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Totale : le jeu de règles est fini et</text>
<text x="236" y="399" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">inspectable.</text>
<text x="560" y="388" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Nulle de l'extérieur : ni code, ni données,</text>
<text x="560" y="399" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">ni modèle publiés.</text>
<line x1="80" y1="418" x2="800" y2="418" stroke="#D9D9C6" stroke-width="1"/>
<line x1="470" y1="124" x2="470" y2="418" stroke="#D9D9C6" stroke-width="1.2"/>
<line x1="228" y1="124" x2="228" y2="418" stroke="#D9D9C6" stroke-width="1.2"/>
<text x="440" y="444" font-family="Lato, sans-serif" font-size="11.89" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Le progrès technique est réel. Il porte sur la fluidité de la langue, non sur la quantité d'information venue de l'arbre.</text>
<text x="440" y="462" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Le dispositif de 2010 était plus honnête sur ce point : nul ne pouvait croire que le chêne rédigeait ses messages.</text>
</svg>
