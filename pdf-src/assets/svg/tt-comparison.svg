<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="880" height="470" fill="#FBF9F1"/>
<text x="440" y="34" font-family="Cormorant Garamond, serif" font-size="16.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.2">TWO “TALKING TREES”, FIFTEEN YEARS APART</text>
<rect x="80" y="66" width="330" height="46" rx="7" fill="#A8552E"/>
<text x="245" y="86" font-family="Lato, sans-serif" font-size="13.63" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.4">BRUSSELS · 2010</text>
<text x="245" y="102" font-family="Lato, sans-serif" font-size="10.73" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Happiness Brussels, for EOS magazine</text>
<rect x="470" y="66" width="330" height="46" rx="7" fill="#2F5E86"/>
<text x="635" y="86" font-family="Lato, sans-serif" font-size="13.63" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.4">LONDON · AUSTIN · DUBLIN · 2025</text>
<text x="635" y="102" font-family="Lato, sans-serif" font-size="10.73" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Droga5, for Agency for Nature</text>
<rect x="80" y="130" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="150" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Tree</text>
<text x="236" y="148" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">One hundred-year-old tree, in Brussels.</text>
<text x="560" y="148" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Three trees in turn: 150, 50 and 200 years</text>
<text x="560" y="159" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">old.</text>
<line x1="80" y1="178" x2="800" y2="178" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="178" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="198" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Sensors</text>
<text x="236" y="196" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ozone, fine particles, a lux meter, a</text>
<text x="236" y="207" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">weather station, a webcam, a microphone.</text>
<text x="560" y="196" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">About ten: bioelectric, soil, air, light,</text>
<text x="560" y="207" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">wind.</text>
<line x1="80" y1="226" x2="800" y2="226" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="226" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="246" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Processing</text>
<text x="236" y="244" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bespoke software: fixed rules produce a</text>
<text x="236" y="255" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">message.</text>
<text x="560" y="244" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A language model running offline on a Mac</text>
<text x="560" y="255" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Mini.</text>
<line x1="80" y1="274" x2="800" y2="274" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="274" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="294" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Voice</text>
<text x="236" y="292" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Delayed posts on Facebook, Twitter, Flickr,</text>
<text x="236" y="303" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">SoundCloud.</text>
<text x="560" y="292" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Live spoken dialogue: the visitor sits down</text>
<text x="560" y="303" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">and talks.</text>
<line x1="80" y1="322" x2="800" y2="322" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="322" width="720" height="48" fill="#FFFFFF"/>
<text x="88" y="342" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">What comes from the human</text>
<text x="236" y="340" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Every sentence, written in advance.</text>
<text x="560" y="340" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The role, the constraints, and all of the</text>
<text x="560" y="351" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">style.</text>
<line x1="80" y1="370" x2="800" y2="370" stroke="#D9D9C6" stroke-width="1"/>
<rect x="80" y="370" width="720" height="48" fill="#F6F2E8"/>
<text x="88" y="390" font-family="Lato, sans-serif" font-size="12.18" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Verifiability</text>
<text x="236" y="388" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Total: the rule set is finite and open to</text>
<text x="236" y="399" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">inspection.</text>
<text x="560" y="388" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Nil from the outside: neither code, nor</text>
<text x="560" y="399" font-family="Lato, sans-serif" font-size="10.73" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">data, nor model published.</text>
<line x1="80" y1="418" x2="800" y2="418" stroke="#D9D9C6" stroke-width="1"/>
<line x1="470" y1="124" x2="470" y2="418" stroke="#D9D9C6" stroke-width="1.2"/>
<line x1="228" y1="124" x2="228" y2="418" stroke="#D9D9C6" stroke-width="1.2"/>
<text x="440" y="444" font-family="Lato, sans-serif" font-size="11.89" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The technical progress is real. It bears on the fluency of the language, not on how much information comes from the tree.</text>
<text x="440" y="462" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The 2010 installation was the more honest on this point: nobody could believe the oak was writing its own messages.</text>
</svg>
