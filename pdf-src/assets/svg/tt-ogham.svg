<text x="208" y="368" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">ceirt — pommier</text>
<rect x="470" y="92" width="366" height="132" rx="7" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.5"/>
<text x="653" y="114" font-family="Lato, sans-serif" font-size="14.5" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Ce qui est attesté</text>
<text x="490" y="136" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">L'ogham est une écriture réelle, documentée par environ</text>
<text x="490" y="148" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">400 inscriptions lapidaires en Irlande et au pays de</text>
<text x="490" y="160" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Galles. Les gloses médiévales associent chaque lettre à un</text>
<text x="490" y="172" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">nom, souvent d'arbre. L'ordre et la valeur des lettres</text>
<text x="490" y="184" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sont établis.</text>
<rect x="470" y="242" width="366" height="144" rx="7" fill="#FBF0E8" stroke="#F0DCC9" stroke-width="1.5"/>
<text x="653" y="264" font-family="Lato, sans-serif" font-size="14.5" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Ce qui ne l'est pas</text>
<text x="490" y="286" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le « calendrier des arbres » et le système divinatoire</text>
<text x="490" y="298" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">qu'on lui associe sont une reconstruction du XXᵉ siècle,</text>
<text x="490" y="310" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">largement due à Robert Graves (« The White Goddess »,</text>
<text x="490" y="322" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">1948). C'est une création poétique moderne, non une</text>
<text x="490" y="334" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">tradition celtique transmise. La dire ancienne est une</text>
<text x="490" y="346" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">erreur ; la pratiquer en le sachant est un choix.</text>
</svg>
