<line x1="110" y1="378.4" x2="140" y2="378.4" stroke="#3F7D5A" stroke-width="2.4"/>
<text x="188" y="368" font-family="Cormorant Garamond, serif" font-size="15.08" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">Q</text>
<text x="208" y="368" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">ceirt — apple</text>
<rect x="470" y="92" width="366" height="132" rx="7" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.5"/>
<text x="653" y="114" font-family="Lato, sans-serif" font-size="14.5" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">What is attested</text>
<text x="490" y="136" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Ogham is a real script, documented by some 400 stone</text>
<text x="490" y="148" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">inscriptions in Ireland and Wales. The medieval glosses</text>
<text x="490" y="160" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">tie each letter to a name, often a tree. The order and the</text>
<text x="490" y="172" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">value of the letters are established.</text>
<rect x="470" y="242" width="366" height="144" rx="7" fill="#FBF0E8" stroke="#F0DCC9" stroke-width="1.5"/>
<text x="653" y="264" font-family="Lato, sans-serif" font-size="14.5" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">What is not</text>
<text x="490" y="286" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The “tree calendar” and the divinatory system attached to</text>
<text x="490" y="298" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">it are a 20th-century reconstruction, owed largely to</text>
<text x="490" y="310" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Robert Graves (“The White Goddess”, 1948). It is a modern</text>
<text x="490" y="322" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">poetic creation, not a Celtic tradition handed down. To</text>
<text x="490" y="334" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">call it ancient is an error; to practise it knowingly is a</text>
<text x="490" y="346" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">choice.</text>
</svg>
