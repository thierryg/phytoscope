<line x1="140" y1="238.4" x2="170" y2="238.4" stroke="#B08528" stroke-width="2.4"/>
<text x="188" y="228" font-family="Cormorant Garamond, serif" font-size="15.08" fill="#0E2A22" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="0">N</text>
<text x="208" y="228" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">nion — ash</text>
