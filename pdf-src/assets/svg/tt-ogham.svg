<text x="208" y="340" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="italic" letter-spacing="0">coll — hazel</text>
<line x1="110" y1="360.0" x2="140" y2="360.0" stroke="#3F7D5A" stroke-width="2.4"/>
