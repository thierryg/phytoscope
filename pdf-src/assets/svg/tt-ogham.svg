<text x="440" y="55" font-family="Lato, sans-serif" font-size="11.6" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">An Irish alphabet of the 4th–6th centuries, carved on the edge of standing stones</text>
