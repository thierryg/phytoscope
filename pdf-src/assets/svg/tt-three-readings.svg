<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="880" height="450" fill="#FBF9F1"/>
<text x="440" y="34" font-family="Cormorant Garamond, serif" font-size="16.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.2">UN MÊME ÉVÉNEMENT, TROIS LECTURES LÉGITIMES</text>
<rect x="230" y="62" width="420" height="52" rx="7" fill="#0E2A22"/>
<text x="440" y="82" font-family="Lato, sans-serif" font-size="11.6" fill="#E0C073" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">L'ÉVÉNEMENT</text>
<text x="440" y="100" font-family="Lato, sans-serif" font-size="12.47" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">À 15 h 20, le tracé s'infléchit brusquement de 9 mV pendant 4 minutes.</text>
<rect x="48" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#2F5E86" stroke-width="1.8"/>
<rect x="48" y="152" width="244" height="26" rx="8" fill="#2F5E86"/>
<rect x="48" y="168" width="244" height="10" fill="#2F5E86"/>
<text x="170" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">LECTURE INSTRUMENTALE</text>
<text x="64" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Vérifier d'abord l'artefact : vent,</text>
<text x="64" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">passage d'un promeneur, rosée,</text>
<text x="64" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">contact d'électrode.</text>
<text x="64" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="64" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Si rien n'explique : consigner</text>
<text x="64" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">l'événement, chercher la</text>
<text x="64" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">corrélation avec les autres voies.</text>
<line x1="64" y1="318" x2="276" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="170" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#2F5E86" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Question : qu'est-ce qui a bougé</text>
<text x="170" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#2F5E86" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">dans la chaîne de mesure ?</text>
<line x1="170" y1="118" x2="170" y2="148" stroke="#2F5E86" stroke-width="1.8" marker-end="url(#ahb)"/>
<rect x="318" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.8"/>
<rect x="318" y="152" width="244" height="26" rx="8" fill="#3F7D5A"/>
<rect x="318" y="168" width="244" height="10" fill="#3F7D5A"/>
<text x="440" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">LECTURE PHYSIOLOGIQUE</text>
<text x="334" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Une variation de cet ordre est</text>
<text x="334" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">compatible avec un potentiel de</text>
<text x="334" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">variation d'origine hydraulique.</text>
<text x="334" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="334" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Hypothèse testable : corréler</text>
<text x="334" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">avec le flux de sève et le</text>
<text x="334" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">déficit de saturation de l'air.</text>
<line x1="334" y1="318" x2="546" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="440" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Question : quel mécanisme connu</text>
<text x="440" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">produirait cela ?</text>
<line x1="440" y1="118" x2="440" y2="148" stroke="#3F7D5A" stroke-width="1.8" marker-end="url(#ahv)"/>
<rect x="588" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#B08528" stroke-width="1.8"/>
<rect x="588" y="152" width="244" height="26" rx="8" fill="#B08528"/>
<rect x="588" y="168" width="244" height="10" fill="#B08528"/>
<text x="710" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">LECTURE SENSIBLE</text>
<text x="604" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Le praticien note ce qu'il</text>
<text x="604" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">percevait au même instant,</text>
<text x="604" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">sans le lire dans l'appareil.</text>
<text x="604" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="604" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">La note se fait à l'aveugle,</text>
<text x="604" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">horodatée, avant consultation</text>
<text x="604" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">des tracés.</text>
<line x1="604" y1="318" x2="816" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="710" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#B08528" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">Question : que se passait-il pour</text>
<text x="710" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#B08528" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">moi à cet instant ?</text>
<line x1="710" y1="118" x2="710" y2="148" stroke="#B08528" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="48" y="396" width="784" height="42" rx="6" fill="#F7F0DC" stroke="#ECDCB0" stroke-width="1.2"/>
<text x="440" y="414" font-family="Lato, sans-serif" font-size="12.47" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Les trois colonnes ne se contredisent pas — elles ne répondent pas à la même question.</text>
<text x="440" y="430" font-family="Lato, sans-serif" font-size="11.31" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">La faute n'est pas de tenir les trois. Elle est de présenter la troisième avec l'autorité de la première.</text>
</svg>
