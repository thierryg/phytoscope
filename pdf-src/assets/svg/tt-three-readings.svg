<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" width="880" height="450">

<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6"
   markerHeight="6" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
</defs>
<rect width="880" height="450" fill="#FBF9F1"/>
<text x="440" y="34" font-family="Cormorant Garamond, serif" font-size="16.68" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2.2">ONE EVENT, THREE LEGITIMATE READINGS</text>
<rect x="230" y="62" width="420" height="52" rx="7" fill="#0E2A22"/>
<text x="440" y="82" font-family="Lato, sans-serif" font-size="11.6" fill="#E0C073" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="2">THE EVENT</text>
<text x="440" y="100" font-family="Lato, sans-serif" font-size="12.47" fill="#FFFFFF" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">At 15:20 the trace bends sharply by 9 mV for 4 minutes.</text>
<rect x="48" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#2F5E86" stroke-width="1.8"/>
<rect x="48" y="152" width="244" height="26" rx="8" fill="#2F5E86"/>
<rect x="48" y="168" width="244" height="10" fill="#2F5E86"/>
<text x="170" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">THE INSTRUMENTAL READING</text>
<text x="64" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Check the artefact first: wind,</text>
<text x="64" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">a passing walker, dew,</text>
<text x="64" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">an electrode contact.</text>
<text x="64" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="64" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">If nothing explains it: record</text>
<text x="64" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the event, and look for a</text>
<text x="64" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">correlation with the other channels.</text>
<line x1="64" y1="318" x2="276" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="170" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#2F5E86" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The question: what moved in the</text>
<text x="170" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#2F5E86" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">measuring chain?</text>
<line x1="170" y1="118" x2="170" y2="148" stroke="#2F5E86" stroke-width="1.8" marker-end="url(#ahb)"/>
<rect x="318" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.8"/>
<rect x="318" y="152" width="244" height="26" rx="8" fill="#3F7D5A"/>
<rect x="318" y="168" width="244" height="10" fill="#3F7D5A"/>
<text x="440" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">THE PHYSIOLOGICAL READING</text>
<text x="334" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A variation of this order is</text>
<text x="334" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">consistent with a variation</text>
<text x="334" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">potential of hydraulic origin.</text>
<text x="334" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="334" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A testable hypothesis: correlate it</text>
<text x="334" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">with the sap flow and the vapour</text>
<text x="334" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">pressure deficit of the air.</text>
<line x1="334" y1="318" x2="546" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="440" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The question: what known mechanism</text>
<text x="440" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#3F7D5A" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">would produce this?</text>
<line x1="440" y1="118" x2="440" y2="148" stroke="#3F7D5A" stroke-width="1.8" marker-end="url(#ahv)"/>
<rect x="588" y="152" width="244" height="228" rx="8" fill="#FFFFFF" stroke="#B08528" stroke-width="1.8"/>
<rect x="588" y="152" width="244" height="26" rx="8" fill="#B08528"/>
<rect x="588" y="168" width="244" height="10" fill="#B08528"/>
<text x="710" y="170" font-family="Lato, sans-serif" font-size="11.02" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">THE FELT READING</text>
<text x="604" y="200" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The practitioner notes what they</text>
<text x="604" y="215" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">perceived at that same moment,</text>
<text x="604" y="230" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">without reading it off the instrument.</text>
<text x="604" y="245" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0"></text>
<text x="604" y="260" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The note is taken blind,</text>
<text x="604" y="275" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">timestamped, before looking at</text>
<text x="604" y="290" font-family="Lato, sans-serif" font-size="11.31" fill="#0E2A22" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the traces.</text>
<line x1="604" y1="318" x2="816" y2="318" stroke="#D9D9C6" stroke-width="1.3" stroke-dasharray="5 4"/>
<text x="710" y="336.0" font-family="Lato, sans-serif" font-size="10.73" fill="#B08528" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The question: what was happening for</text>
<text x="710" y="347.5" font-family="Lato, sans-serif" font-size="10.73" fill="#B08528" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">me at that moment?</text>
<line x1="710" y1="118" x2="710" y2="148" stroke="#B08528" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="48" y="396" width="784" height="42" rx="6" fill="#F7F0DC" stroke="#ECDCB0" stroke-width="1.2"/>
<text x="440" y="414" font-family="Lato, sans-serif" font-size="12.47" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The three columns do not contradict one another — they do not answer the same question.</text>
<text x="440" y="430" font-family="Lato, sans-serif" font-size="11.31" fill="#A8552E" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The fault is not in holding all three. It is in presenting the third with the authority of the first.</text>
</svg>
