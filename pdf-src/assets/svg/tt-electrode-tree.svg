<text x="215" y="432" font-family="Lato, sans-serif" font-size="12.18" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">trunk</text>
<rect x="300" y="104" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.5"/>
<circle cx="322" cy="126" r="12" fill="#3F7D5A"/>
<text x="322" y="129.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="342" y="130" font-family="Lato, sans-serif" font-size="13.05" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">YES</text>
<text x="342" y="146.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">The electrode held under a wide elastic</text>
<text x="342" y="156.5" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">collar, never a tight one.</text>
<rect x="300" y="186" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.5"/>
<circle cx="322" cy="208" r="12" fill="#3F7D5A"/>
<text x="322" y="211.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="342" y="212" font-family="Lato, sans-serif" font-size="13.05" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">YES</text>
<text x="342" y="228.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A loose loop of cable: the tree thickens,</text>
<text x="342" y="238.5" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">the cable must follow.</text>
<rect x="300" y="268" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#3F7D5A" stroke-width="1.5"/>
<circle cx="322" cy="290" r="12" fill="#3F7D5A"/>
<text x="322" y="293.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✓</text>
<text x="342" y="294" font-family="Lato, sans-serif" font-size="13.05" fill="#3F7D5A" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">YES</text>
<text x="342" y="310.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Check and loosen at every growing season.</text>
<rect x="590" y="104" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.5"/>
<circle cx="612" cy="126" r="12" fill="#A8552E"/>
<text x="612" y="129.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="632" y="130" font-family="Lato, sans-serif" font-size="13.05" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">NO</text>
<text x="632" y="146.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A screw or a nail in the cambium: a way in</text>
<text x="632" y="156.5" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">for pathogens.</text>
<rect x="590" y="186" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.5"/>
<circle cx="612" cy="208" r="12" fill="#A8552E"/>
<text x="612" y="211.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="632" y="212" font-family="Lato, sans-serif" font-size="13.05" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">NO</text>
<text x="632" y="228.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A strap tightened around the trunk:</text>
<text x="632" y="238.5" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">strangulation in the end.</text>
<rect x="590" y="268" width="248" height="66" rx="6" fill="#FFFFFF" stroke="#A8552E" stroke-width="1.5"/>
<circle cx="612" cy="290" r="12" fill="#A8552E"/>
<text x="612" y="293.5" font-family="Lato, sans-serif" font-size="15.95" fill="#FFFFFF" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">✗</text>
<text x="632" y="294" font-family="Lato, sans-serif" font-size="13.05" fill="#A8552E" text-anchor="start" font-weight="700" font-style="normal" letter-spacing="1.4">NO</text>
<text x="632" y="310.0" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">A cable fixed permanently into the bark:</text>
<text x="632" y="320.5" font-family="Lato, sans-serif" font-size="10.58" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">it will end up inside the wood.</text>
<rect x="146" y="150" width="138" height="14" rx="7" fill="none" stroke="#3F7D5A" stroke-width="2.6"/>
<rect x="258" y="146" width="22" height="22" rx="4" fill="#3F7D5A"/>
<path d="M280,157 q30,26 18,60" fill="none" stroke="#3F7D5A" stroke-width="2"/>
<rect x="150" y="352" width="698" height="72" rx="6" fill="#EAF3ED" stroke="#CFE6DC" stroke-width="1.2"/>
<text x="499" y="372" font-family="Lato, sans-serif" font-size="13.63" fill="#2F7D5E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">The principle that outranks every other</text>
<text x="499" y="390.0" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">The tree is a living being several centuries old, not a mounting bracket. Any measurement that shortens</text>
<text x="499" y="401.5" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">its life is a failed measurement, however good the signal obtained. When in doubt: a non-invasive</text>
<text x="499" y="413.0" font-family="Lato, sans-serif" font-size="11.02" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">sensor, or no sensor at all.</text>
</svg>
