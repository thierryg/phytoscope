<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520">
<defs>
 <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#B08528"/></marker>
 <marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#2F5E86"/></marker>
 <marker id="ahv" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#3F7D5A"/></marker>
 <marker id="ahk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5"
   markerHeight="5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#23302C"/></marker>
 <marker id="ahc" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5"
   markerHeight="5.5" orient="auto-start-reverse">
   <path d="M0,0 L10,5 L0,10 z" fill="#A8552E"/></marker>
 <pattern id="hatch" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#E0C073" stroke-width="2.4"/></pattern>
 <pattern id="hatchb" width="7" height="7" patternTransform="rotate(45)"
   patternUnits="userSpaceOnUse">
   <line x1="0" y1="0" x2="0" y2="7" stroke="#cfe0f2" stroke-width="2.8"/></pattern>
</defs>
<rect width="980" height="520" fill="#FFFFFF"/>
<text x="490.0" y="35.95503184" font-family="Cormorant Garamond, serif" font-size="30.42" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Timestamping: two clocks, one truth</text>
<text x="490.0" y="66.37852031999999" font-family="Lato, sans-serif" font-size="20.47" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="italic" letter-spacing="0">The sample index is authoritative; the system clock is only a label</text>
<rect x="40" y="96" width="420" height="180" rx="8" fill="#F3F8F5" stroke="#3F7D5A" stroke-width="1.4"/>
<text x="250" y="120" font-family="Lato, sans-serif" font-size="18.81" fill="#3F7D5A" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">THE BOARD'S CLOCK</text>
<text x="250" y="148" font-family="DejaVu Sans Mono, monospace" font-size="19.36" fill="#0E2A22" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">TCXO 12,288 MHz · ±1 ppm</text>
<text x="250" y="172" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">n = 0, 1, 2, 3 … compteur 64 bits</text>
<text x="250" y="196" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">t = n / 250 Hz, exactement</text>
<text x="250" y="226" font-family="Lato, sans-serif" font-size="17.15" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">drift: 86 ms a day, at worst</text>
<text x="250" y="248" font-family="Lato, sans-serif" font-size="17.15" fill="#A8552E" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">never corrected during a session</text>
<rect x="520" y="96" width="420" height="180" rx="8" fill="#EEF3FA" stroke="#2F5E86" stroke-width="1.4"/>
<text x="730" y="120" font-family="Lato, sans-serif" font-size="18.81" fill="#2F5E86" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="1.2">HORLOGE DE L'ORDINATEUR</text>
<text x="730" y="148" font-family="DejaVu Sans Mono, monospace" font-size="19.36" fill="#0E2A22" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">CLOCK_MONOTONIC + UTC</text>
<text x="730" y="172" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">sauts possibles : NTP, veille,</text>
<text x="730" y="192" font-family="Lato, sans-serif" font-size="17.7" fill="#23302C" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">changement d'heure, suspension</text>
<text x="730" y="226" font-family="Lato, sans-serif" font-size="17.15" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">used only to name files</text>
<text x="730" y="248" font-family="Lato, sans-serif" font-size="17.15" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">and to date the session's start</text>
<rect x="250" y="320" width="480" height="78" rx="7" fill="#F7F0DC" stroke="#B08528" stroke-width="1.6"/>
<text x="490.0" y="352" font-family="Cormorant Garamond, serif" font-size="21.02" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">An affine fit, as it goes</text>
<text x="490.0" y="372" font-family="Lato, sans-serif" font-size="16.59" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">t_UTC = a · n + b, re-estimated every 10 s</text>
<line x1="250" y1="276" x2="360" y2="316" stroke="#3F7D5A" stroke-width="1.8" marker-end="url(#ahv)"/>
<line x1="730" y1="276" x2="620" y2="316" stroke="#2F5E86" stroke-width="1.8" marker-end="url(#ahb)"/>
<text x="490" y="430" font-family="Lato, sans-serif" font-size="18.25" fill="#0E2A22" text-anchor="middle" font-weight="700" font-style="normal" letter-spacing="0">Result: two sessions recorded on two different machines stay superimposable to the millisecond.</text>
<text x="490" y="452" font-family="Lato, sans-serif" font-size="17.15" fill="#6B7A72" text-anchor="middle" font-weight="400" font-style="normal" letter-spacing="0">Every file carries both scales; neither is lost.</text>
<text x="28" y="512" font-family="Lato, sans-serif" font-size="15.49" fill="#6B7A72" text-anchor="start" font-weight="400" font-style="normal" letter-spacing="0">Bretagne Namasté</text>
<text x="952" y="512" font-family="DejaVu Sans Mono, monospace" font-size="15.49" fill="#6B7A72" text-anchor="end" font-weight="400" font-style="normal" letter-spacing="0">bretagne-namaste.com</text>
</svg>
