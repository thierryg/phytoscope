[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "phytoscope"
#  La version vit dans `phytoscope/version.py`, seule source de vérité, et
#  `tools/release.py` est le seul à l'écrire. La déclarer ici aussi la faisait
#  dériver : elle est restée à 1.0.0 pendant cinq versions.
dynamic = ["version"]
description = "Écoute, mesure et enregistrement des signaux végétaux"
readme = "README.txt"
requires-python = ">=3.9"
license = { file = "LICENCE.txt" }
authors = [{ name = "Bretagne Namasté", email = "contact@bretagne-namaste.com" }]
keywords = ["plante", "biosignal", "sonification", "electrophysiologie",
            "oscilloscope", "MIDI"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "PySide6>=6.5"]

[tool.setuptools.dynamic]
version = { attr = "phytoscope.version.VERSION" }

[project.optional-dependencies]
complet = ["pyqtgraph>=0.13", "sounddevice>=0.4.6", "pyserial>=3.5",
           "python-rtmidi>=1.5", "pyttsx3>=2.90"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1"]

[project.urls]
"Site" = "https://bretagne-namaste.com"
"Contact" = "mailto:contact@bretagne-namaste.com"

[project.gui-scripts]
phytoscope = "phytoscope.__main__:main"

[tool.setuptools.packages.find]
include = ["phytoscope*"]

#  Les données qui doivent suivre le logiciel partout où il s'installe : le
#  numéro de version, les catalogues de traduction et les dictionnaires du
#  mode vocal. Sans cette déclaration, une roue les laisserait derrière elle.
[tool.setuptools.package-data]
phytoscope = ["VERSION", "AUTEURS", "langues/*.json", "lexiques/*.json"]

[tool.ruff]
line-length = 90
target-version = "py39"

#  Deux niveaux, et c'est voulu.
#
#  « lint.select » ci-dessous est le jeu qui FAIT ÉCHOUER l'intégration
#  continue : la syntaxe, et les noms qui n'existent pas. Ce sont des
#  plantages, pas des questions de style. Deux d'entre eux dormaient dans le
#  dépôt jusqu'au 2026-09-18 — un `mode` disparu d'une refonte qui cassait la
#  capture de trames, et un `echec` non importé qui faisait planter la
#  fabrication du .rpm là où elle devait diagnostiquer proprement.
#
#  Le reste — annotations PEP 585, imports inutilisés, `except` nus — est
#  RÉEL mais ne casse rien aujourd'hui : plus de mille occurrences, héritées
#  d'un code écrit pour Python 3.9. Les corriger d'un coup produirait une
#  révision illisible. Elles sont donc signalées sans bloquer, par
#  « make lint » et par un pas facultatif de la CI, et se résorbent au fil
#  des modifications.
[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823", "F811"]

[tool.ruff.lint.per-file-ignores]
#  Les tests importent parfois pour vérifier qu'un import fonctionne.
"tests/*" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
