# ===========================================================================
#  PhytoScope — the OpenSSF Scorecard reading
# ===========================================================================
#  Scorecard marks the repository's practices, not its code: the workflows'
#  permissions, whether dependencies are pinned, the presence of a security
#  policy, code review, signed releases.
#
#  The point is not the score. The point is that the score gets READ: it names
#  precisely what is missing, and it does so at every change to the
#  repository's configuration — the moment when these things break quietly.
# ===========================================================================
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:

permissions: read-all

jobs:
  reading:
    name: The repository's practices
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          #  publish_results: the reading becomes public and feeds the
          #  README's badge. That is intended: a project that displays its
          #  score commits to looking at it.
          publish_results: true

      - uses: actions/upload-artifact@v7
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard.sarif
          category: scorecard
