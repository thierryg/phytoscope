# ===========================================================================
#  PhytoScope — contrôles de sécurité
# ===========================================================================
#  Six questions, posées à chaque poussée et une fois par semaine :
#
#    · un secret a-t-il fui dans l'historique ? (gitleaks, garde-fou maison)
#    · le code fait-il quelque chose d'imprudent ? (bandit)
#    · une dépendance porte-t-elle une faille connue ? (pip-audit, trivy)
#    · cette demande de fusion en ajoute-t-elle une ? (dependency-review)
#    · les licences sont-elles déclarées et cohérentes ? (reuse, contrôle maison)
#    · les workflows demandent-ils plus de droits qu'il n'en faut ? (zizmor)
#
#  Le contrôle hebdomadaire existe parce qu'une faille apparaît dans une
#  dépendance sans que personne ne touche au dépôt : sans lui, on l'apprend
#  à la publication suivante.
# ===========================================================================
name: Sécurité

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: securite-${{ github.ref }}
  cancel-in-progress: true

jobs:

  secrets:
    name: Aucun secret dans le dépôt
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      #  fetch-depth: 0 — gitleaks doit voir tout l'historique : un secret
      #  retiré au commit suivant reste dans les objets git.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #  Le garde-fou propre au projet : la clé privée de signature ne doit
      #  jamais être suivie, et le certificat public doit l'être (C-2R).
      - name: La clé privée de signature n'est pas suivie
        run: |
          echo "── ce que git suit et qui ressemble à une clé"
          suivis=$(git ls-files | grep -Ei '\.(key|p12|pfx|jks|keystore|asc|gpg|kdbx)$' || true)
          if [ -n "$suivis" ]; then
            echo "! ces fichiers ne devraient pas être suivis :"; echo "$suivis"; exit 1
          fi
          echo "  · aucune clé suivie"
          echo "── le certificat PUBLIC, lui, doit être suivi"
          git ls-files --error-unmatch certificat/phytoscope-certificat.pem >/dev/null
          echo "  · certificat public présent"

      - name: Aucune clé privée en clair dans les fichiers suivis
        run: |
          if git grep -lE 'BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY' -- \
               $(git ls-files | grep -v '^sources/') > /tmp/fuites 2>/dev/null; then
            echo "! bloc de clé privée trouvé dans :"; cat /tmp/fuites; exit 1
          fi
          echo "  · aucun bloc de clé privée"

  code:
    name: Analyse du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Outils
        run: |
          python -m pip install --upgrade pip
          python -m pip install bandit[sarif] pip-audit

      #  « sources/ » est du code tiers : ses défauts se signalent en amont,
      #  pas ici. Voir SECURITY.md, § Hors portée.
      - name: bandit
        run: |
          bandit -r packaging tools src/phytoscope \
                 --exclude '**/tests/**' \
                 --severity-level medium --confidence-level medium \
                 --format screen
        continue-on-error: true

      - name: bandit — rapport SARIF pour l'onglet Security
        run: |
          bandit -r packaging tools src/phytoscope \
                 --exclude '**/tests/**' \
                 --format sarif --output bandit.sarif || true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit.sarif
          category: bandit
        continue-on-error: true

  dependances:
    name: Failles connues des dépendances
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          cd src/phytoscope
          pip-audit --requirement requirements.txt --strict --progress-spinner off
        continue-on-error: true

      #  Le SBOM est versionné (src/phytoscope/sbom.cdx.json). S'il ne
      #  correspond plus aux dépendances déclarées, il faut le régénérer :
      #  un SBOM faux est pire qu'aucun SBOM.
      - name: Le SBOM est-il à jour ?
        run: |
          cd src/phytoscope
          python -m pip install -r requirements.txt
          python tools/sbom.py --json > /tmp/sbom-neuf.json
          if ! diff -q <(python -c "import json;d=json.load(open('sbom.cdx.json'));print(len(d.get('components',[])))") \
                       <(python -c "import json;d=json.load(open('/tmp/sbom-neuf.json'));print(len(d.get('components',[])))"); then
            echo "! le SBOM versionné ne compte pas le même nombre de composants"
            echo "  régénérez-le :  .venv/bin/python tools/sbom.py --json > sbom.cdx.json"
            exit 1
          fi
          echo "  · SBOM cohérent"
        continue-on-error: true

  # -------------------------------------------------------------------------
  #  Ce que cette demande de fusion ajoute comme risque
  # -------------------------------------------------------------------------
  #  Contrôle propre aux demandes de fusion : il refuse l'ajout d'une
  #  dépendance porteuse d'une faille connue, ou d'une licence incompatible.
  #  Le refuser AVANT la fusion coûte une minute ; après, une republication.
  revue-dependances:
    name: Revue des dépendances ajoutées
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          #  Le projet est sous MIT et CERN-OHL-P v2 : une dépendance
          #  copyleft fort rendrait la diffusion du logiciel impossible
          #  telle qu'elle est annoncée (C-53).
          deny-licenses: GPL-3.0, AGPL-3.0, GPL-2.0, SSPL-1.0

  # -------------------------------------------------------------------------
  #  Failles connues dans tout l'arbre, pas seulement les dépendances Python
  # -------------------------------------------------------------------------
  arborescence:
    name: Analyse de l'arborescence (trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: trivy — système de fichiers
        #  Épinglé par empreinte de commit, et non par étiquette : une
        #  étiquette se déplace, une empreinte non. C'est aussi ce que
        #  réclame zizmor (règle « unpinned-uses ») pour une action tierce.
        #  Le commentaire dit la version lisiblement ; Dependabot met les
        #  deux à jour ensemble.
        #
        #  Cette ligne a déjà échoué une fois : « @0.28.0 » — sans le « v »
        #  — n'existe pas, et le travail devenait rouge dès « Set up job »,
        #  AVANT que « continue-on-error » ne puisse s'appliquer. D'où
        #  l'étape « Chaque action référencée existe » du travail suivant.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH,MEDIUM
          #  Sans ceci, « severity » ci-dessus ne s'applique PAS au rapport
          #  SARIF : l'action y verse toutes les gravités. Le filtre annoncé
          #  serait alors faux.
          limit-severities-for-sarif: true
          format: sarif
          output: trivy.sarif
          #  « sources/ » est du code tiers, recopié pour l'ouvrage : ses
          #  failles se signalent en amont (voir SECURITY.md, § Hors portée).
          #  « .ecarte/ » n'est pas dans le dépôt.
          skip-dirs: sources,.ecarte,build
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy.sarif
          category: trivy
        continue-on-error: true

  # -------------------------------------------------------------------------
  #  Les licences sont-elles déclarées, et disent-elles la vérité ?
  # -------------------------------------------------------------------------
  #  Ce contrôle existe à cause d'un défaut réel : l'outil d'en-têtes avait
  #  apposé « SPDX-License-Identifier: MIT » et notre copyright sur 32
  #  fichiers du micrologiciel Biotron, qui est en GPL-3.0, et sur LEDFader
  #  et MIDI Sprout, qui appartiennent à d'autres. C'était une fausse
  #  déclaration de licence et de paternité. Corrigé le 2026-09-18 ; ce
  #  contrôle est là pour que cela ne revienne pas.
  licences:
    name: Cohérence des licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Notre en-tête n'est jamais posé sur du code tiers
        run: |
          fautifs=$(grep -rl 'PhytoScope — attribution' sources/ 2>/dev/null \
                    | grep -v '^sources/reverse/' || true)
          if [ -n "$fautifs" ]; then
            echo "! notre attribution se trouve sur du code tiers :"
            echo "$fautifs"
            echo
            echo "  sources/ est exclu de tools/entetes.py pour cette raison."
            echo "  Retirez ces en-têtes : chaque projet garde sa licence."
            exit 1
          fi
          echo "  · aucune attribution abusive"

      #  Le contrôle a d'abord été écrit « ls "$d"LICENSE* "$d"LICENCE*
      #  "$d"COPYING* ». C'était faux : `ls` rend un code non nul dès qu'UN
      #  des motifs ne trouve rien, même si les autres trouvent. Les trois
      #  projets avaient bien leur licence, et le contrôle les déclarait tous
      #  les trois manquants. `find` ne se trompe pas là-dessus, et il
      #  ignore la casse d'un seul coup.
      - name: Chaque projet tiers recopié garde son fichier de licence
        run: |
          manquants=0
          for d in sources/schemas/*/; do
            fichier=$(find "$d" -maxdepth 1 -type f \
                        \( -iname 'LICENSE*' -o -iname 'LICENCE*' \
                           -o -iname 'COPYING*' \) -printf '%f\n' \
                      | sort | head -1)
            if [ -z "$fichier" ]; then
              echo "! $d — aucun fichier de licence"
              manquants=1
            else
              echo "  · $d$fichier"
            fi
          done
          exit $manquants

      - name: Les deux licences du projet sont présentes et annoncées
        run: |
          for f in LICENSE LICENSES/MIT.txt LICENSES/CERN-OHL-P-2.0.txt LICENSES/README.md; do
            test -f "$f" && echo "  · $f" || { echo "! $f manquant"; exit 1; }
          done

      - name: Les en-têtes d'attribution sont à jour
        run: python3 tools/entetes.py --verifier

      - name: reuse — conformité de la déclaration des licences
        run: |
          python -m pip install --quiet reuse
          reuse lint || true
        continue-on-error: true

  # -------------------------------------------------------------------------
  #  Les workflows eux-mêmes sont du code : ils s'analysent
  # -------------------------------------------------------------------------
  #  Un workflow qui demande « contents: write » là où « read » suffit, ou qui
  #  interpole ${{ github.event.* }} dans un « run: », est une porte ouverte.
  workflows:
    name: Analyse des workflows (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      #  zizmor lit les workflows ; il ne demande pas à GitHub si les
      #  actions référencées existent. Deux d'entre elles n'existaient pas —
      #  voir la docstring de l'outil. Cette étape n'est PAS tolérante :
      #  c'est la seule du travail qui peut refuser une fusion, parce
      #  qu'une référence morte rend un contrôle de sécurité silencieux.
      #  Aucun jeton : l'outil interroge les dépôts par `git ls-remote`,
      #  qui ne consomme pas le quota de l'API. La première version passait
      #  par api.github.com et a échoué en « 403, limite dépassée » — dans
      #  une étape non tolérante, un quota aurait bloqué une fusion pour une
      #  raison étrangère aux workflows.
      - name: Chaque action référencée existe, et les tierces sont épinglées
        run: python3 tools/verifier_actions.py --epingle

      - name: zizmor
        run: |
          python -m pip install --quiet zizmor
          zizmor --format sarif .github/workflows/ > zizmor.sarif || true
          zizmor .github/workflows/ || true
        continue-on-error: true

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: zizmor.sarif
          category: zizmor
        continue-on-error: true
