# ===========================================================================
#  PhytoScope — CodeQL semantic analysis
# ===========================================================================
#  Different from bandit, and complementary: bandit recognises imprudent
#  patterns line by line, CodeQL follows where a value goes from its entry to
#  its use. That is what makes it possible to see that a value read from the
#  serial port ends up in a command, which no local rule can say.
#
#  Two languages: Python (the software, the factory, the tools) and C (the
#  RP2350 firmware). C requires a real build — hence fetching the Pico SDK,
#  in manual mode.
# ===========================================================================
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    #  Monday morning: a new CodeQL rule sometimes finds an old defect,
    #  without anybody having touched the code.
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: CodeQL — ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: c-cpp
            build-mode: manual

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.language == 'python'
        with:
          python-version: '3.12'

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix['build-mode'] }}
          #  "security-and-quality" adds correctness defects to the security
          #  alerts — dead code, a comparison that is always true.
          queries: security-and-quality
          config: |
            paths-ignore:
              - sources/**
              - build/**
              - pdf-src/assets/**
              - '**/tests/**'

      #  The firmware does not build without the Pico SDK. `_make_.sh --deps`
      #  installs it in $HOME, without sudo (C-55).
      - name: Build the firmware
        if: matrix.language == 'c-cpp'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential
          cd src/firmware
          ./_make_.sh --deps
          ./build.sh
        continue-on-error: true

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
