# ===========================================================================
#  PhytoScope — building the publications that were touched
# ===========================================================================
#  Triggered by whatever a PDF depends on: the publishing sources
#  (`pdf-src/`), the bill of materials (`hardware/`) that feeds the companion
#  volume's BOM, the program listings of the code appendix, and the tools
#  that write fragments.
#
#  It does NOT remake all ten publications every time. Remaking the series
#  costs a dozen minutes and 84 MB for nothing when a typo has been fixed in
#  the companion volume. `tools/impacted_pdfs.py` takes the list of changed
#  files and returns the commands to run — and nothing else.
#
#  The tool is deliberately cautious: a path it cannot attribute triggers
#  everything. Being wrong by rebuilding too much costs minutes; being wrong
#  by rebuilding too little publishes a stale PDF, and that does not show.
#
#  On `main`, and on manual request, everything is remade: that is where the
#  consistency of the whole is checked.
# ===========================================================================
name: Publications

on:
  push:
    branches: [main]
    paths:
      - 'pdf-src/**'
      - 'hardware/**'
      - 'sources/reverse/**'
      - 'tools/**'
      - '.github/workflows/publications.yml'
  pull_request:
    paths:
      - 'pdf-src/**'
      - 'hardware/**'
      - 'sources/reverse/**'
      - 'tools/**'
  workflow_dispatch:
    inputs:
      tout:
        description: 'Refaire les dix publications, sans regarder les modifications'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publications:
    name: Impacted publications
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      #  fetch-depth: 0 — the history is needed in order to know what
      #  changed with respect to the pull request's base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      #  WeasyPrint leans on Pango, Cairo and HarfBuzz: those are system
      #  libraries, and pip does not bring them.
      - name: Rendering libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libharfbuzz0b \
            libfribidi0 libgdk-pixbuf-2.0-0 fonts-dejavu-core poppler-utils
          python -m pip install --upgrade pip weasyprint pillow

      # ---------------------------------------------------------------------
      #  What changed, and what does that make stale?
      # ---------------------------------------------------------------------
      - name: Changed files
        id: modifies
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base='${{ github.event.pull_request.base.sha }}'
            git diff --name-only "$base" "${{ github.sha }}" > modifies.txt
          elif [ "${{ github.event_name }}" = "push" ]; then
            #  « before » vaut 000… sur une branche neuve : on refait tout.
            avant='${{ github.event.before }}'
            if [ -z "$avant" ] || [ "$avant" = "0000000000000000000000000000000000000000" ]; then
              : > modifies.txt
              echo 'tout=oui' >> "$GITHUB_OUTPUT"
            else
              git diff --name-only "$avant" "${{ github.sha }}" > modifies.txt
            fi
          else
            : > modifies.txt
            echo 'tout=oui' >> "$GITHUB_OUTPUT"
          fi
          echo "── changed files"
          sed 's/^/  · /' modifies.txt || true

      - name: Publications to rebuild
        id: cibles
        run: |
          #  On main and on manual request: everything, to check the
          #  consistency of the whole.
          if [ '${{ github.ref }}' = 'refs/heads/main' ] \
             || [ '${{ steps.modifies.outputs.tout }}' = 'oui' ] \
             || [ '${{ inputs.tout }}' = 'true' ]; then
            echo '  · tout est refait'
            printf 'python3 pdf-src/assets/svg/gen.py\n' > commandes.sh
            printf 'python3 pdf-src/assets/svg/gen_board.py\n' >> commandes.sh
            printf 'python3 pdf-src/assets/svg/gen_sch.py\n' >> commandes.sh
            printf 'python3 pdf-src/assets/svg/gen_sdk.py\n' >> commandes.sh
            printf 'python3 pdf-src/assets/svg/gen_tt.py\n' >> commandes.sh
            printf 'python3 tools/gen_bom.py\n' >> commandes.sh
            printf 'python3 tools/gen_code_annex.py\n' >> commandes.sh
            printf 'python3 pdf-src/build.py\n' >> commandes.sh
            printf 'python3 pdf-src/build_tree.py\n' >> commandes.sh
            printf 'python3 tools/build-annexe.py\n' >> commandes.sh
            printf 'python3 pdf-src/build_board.py\n' >> commandes.sh
            printf 'python3 pdf-src/build_sdk.py\n' >> commandes.sh
            printf 'python3 sources/build_references.py\n' >> commandes.sh
          else
            python3 tools/impacted_pdfs.py - < modifies.txt > commandes.sh
          fi
          echo "── to run"
          sed 's/^/  · /' commandes.sh
          echo "── the PDFs that will be rewritten"
          python3 tools/impacted_pdfs.py - < modifies.txt --pdf 2>/dev/null \
            | sed 's/^/  · /' || true
          if [ ! -s commandes.sh ]; then
            echo "rien=oui" >> "$GITHUB_OUTPUT"
            echo "  · no publication touched — nothing to do"
          fi

      # ---------------------------------------------------------------------
      #  Build, and only what needs building
      # ---------------------------------------------------------------------
      - name: Illustrations and fragments, then the impacted publications
        if: steps.cibles.outputs.rien != 'oui'
        run: |
          set -euo pipefail
          while IFS= read -r commande; do
            [ -z "$commande" ] && continue
            echo "── $commande"
            eval "$commande"
          done < commandes.sh

      #  The reference documents are written next to their source, because
      #  that is where a reader of the repository looks for them. Collected
      #  into build/ here so that the page-count check below and the artefact
      #  treat them exactly like the ten publications.
      - name: Collect the reference documents alongside the publications
        if: steps.cibles.outputs.rien != 'oui'
        run: |
          set -euo pipefail
          mkdir -p build
          for f in sources/*/*.pdf; do
            [ -e "$f" ] || continue
            cp -v "$f" build/
          done

      #  An illustration that is not well-formed XML goes unnoticed on screen
      #  and leaves an empty frame in the PDF. The defect has happened:
      #  timeline.svg carried a bare "&", because the generator did not escape
      #  its text (journal entry of 2026-09-18).
      - name: Is every illustration well-formed XML?
        if: steps.cibles.outputs.rien != 'oui'
        run: python3 tools/verify_svg.py

      - name: Are the attribution headers up to date?
        if: steps.cibles.outputs.rien != 'oui'
        run: python3 tools/headers.py --verifier

      #  The useful check here is not "it compiles" but "it has not shrunk":
      #  an unclosed fragment does not break WeasyPrint, it produces a shorter
      #  PDF. The thresholds are deliberately low — they catch a collapse, not
      #  a one-page variation.
      - name: No publication has collapsed
        if: steps.cibles.outputs.rien != 'oui'
        run: |
          declare -A seuil=(
            ['La-Musique-des-Plantes.pdf']=400
            ['La-Carte-PhytoSense.pdf']=150
            ['arbre-parlant-dublin-analyse-scientifique.pdf']=150
            ['plant-biocommunication-and-ai.pdf']=120
            ['workshop-build-a-talking-tree.pdf']=150
            ['arbre-parlant-annexe-schemas-bom-programmes.pdf']=40
            ['writing-a-phytoscope-module.pdf']=20
            ['PhytoSense-schematics.pdf']=8
            ['PhytoSense-bom-accessories.pdf']=12
            ['PhytoSense-pcb.pdf']=5
            ['MIDI-Protocol-Reference.pdf']=18
            ['USB-Device-Reference.pdf']=16
          )
          ec=0
          total=0
          for f in build/*.pdf; do
            [ -e "$f" ] || continue
            nom="${f##*/}"
            n=$(pdfinfo "$f" | awk '/^Pages/ {print $2}')
            total=$((total + n))
            attendu="${seuil[$nom]:-1}"
            if [ "$n" -lt "$attendu" ]; then
              printf '%5d p.  %-52s ! attendu ≥ %s\n' "$n" "$nom" "$attendu"
              ec=1
            else
              printf '%5d p.  %-52s OK\n' "$n" "$nom"
            fi
          done
          printf '%5d p.  TOTAL\n' "$total"
          exit $ec

      - uses: actions/upload-artifact@v7
        if: steps.cibles.outputs.rien != 'oui'
        with:
          name: publications-pdf
          path: build/*.pdf
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  #  "latest": the PDFs, downloadable, on every push to main
  # -------------------------------------------------------------------------
  #  Same reason as in packages.yml: a CI artefact expires and requires an
  #  account. The ten publications come to 1,378 pages; making them readable
  #  from a link, with no account, is half the point of building them.
  #
  #  This job drops its files into the SAME rolling `latest` release as the
  #  packages. softprops/action-gh-release adds or replaces the files it is
  #  given and leaves the others in place: the two workflows therefore share
  #  one page, each keeping its own files up to date.
  latest-pdf:
    name: Publish the PDFs to “latest”
    needs: publications
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: publications-pdf
          path: latest
        continue-on-error: true

      - name: Publication checksums
        id: pret
        run: |
          if [ ! -d latest ] || [ -z "$(ls -A latest 2>/dev/null)" ]; then
            echo "  no PDF remade by this push — nothing to publish."
            echo "rien=oui" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd latest
          sha256sum -- *.pdf > SHA256SUMS-pdf.txt
          echo "  $(ls -1 *.pdf | wc -l) publication(s) :"
          pdfinfo=$(command -v pdfinfo || true)
          for f in *.pdf; do
            n=""
            [ -n "$pdfinfo" ] && n=$(pdfinfo "$f" | awk '/^Pages/ {print $2}')
            printf '      %-52s %s %s\n' "$f" "${n:-?}" "pages"
          done

      - name: Publish
        if: steps.pret.outputs.rien != 'oui'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: latest
          name: Latest build of main
          prerelease: true
          make_latest: false
          files: |
            latest/*.pdf
            latest/SHA256SUMS-pdf.txt
