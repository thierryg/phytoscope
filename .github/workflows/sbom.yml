# ===========================================================================
#  PhytoScope — the bill of materials follows the code
# ===========================================================================
#  Triggered as soon as a change touches the software, the firmware or their
#  declared dependencies. It regenerates **both** bills of materials — the
#  software's, shipped inside the packages, and the whole project's — and, if
#  they changed, commits them back.
#
#  Why automate it rather than remember to do it: **a false SBOM is worse than
#  no SBOM.** Its purpose is to answer "does this vulnerability concern me?",
#  and an answer founded on a stale list is a false assurance. The only moment
#  one is sure it matches the code is the moment the code has just changed.
#
#  On a pull request nothing is written — one does not write into somebody
#  else's branch: the discrepancy is reported as a comment, and
#  `security.yml` refuses it if it persists.
# ===========================================================================
name: Bill of materials

on:
  push:
    branches: [main]
    paths:
      - 'src/phytoscope/**'
      - 'src/firmware/**'
      - 'tools/sbom.py'
      - '.github/workflows/sbom.yml'
  pull_request:
    paths:
      - 'src/phytoscope/**'
      - 'src/firmware/**'
      - 'tools/sbom.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    name: Regenerate the SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the SBOM back on main
      pull-requests: write     # to report it on a pull request
    steps:
      - uses: actions/checkout@v7
        with:
          #  The default token is enough: we push to the same branch.
          #  `persist-credentials` stays true, which is what allows it.
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      #  The SBOM enumerates what is REALLY installed, so the dependencies
      #  have to be installed rather than requirements.txt merely read. That
      #  is the difference between "what we ask for" and "what we have".
      - name: The software's dependencies
        working-directory: src/phytoscope
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-optionnel.txt

      #  Two bills of materials, two scopes — and that is intentional:
      #
      #    · src/phytoscope/sbom.cdx.json  the SOFTWARE, shipped in packages
      #    · sbom.cdx.json (at the root)   the PROJECT, firmware included
      #
      #  The second covers the Pico SDK, TinyUSB and the ARM toolchain, which
      #  are not Python packages. Without them the list was partial, and a
      #  partial list gives a false assurance.
      - name: Regenerate both bills of materials
        run: |
          cp src/phytoscope/sbom.cdx.json /tmp/before-software.json 2>/dev/null \
            || echo '{}' > /tmp/before-software.json
          cp sbom.cdx.json /tmp/before-project.json 2>/dev/null \
            || echo '{}' > /tmp/before-project.json
          python tools/sbom.py --ecrire --logiciel-seul
          python tools/sbom.py

      #  The comparison ignores the timestamp: the SBOM carries the date it
      #  was produced, which changes on every run without anything having
      #  moved. Comparing the raw files would make one revision a day.
      - name: Did they really change?
        id: diff
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os

          def useful(path):
              """The components and their versions — not the timestamp.

              The document carries the date it was produced and a randomly
              drawn serial number: comparing those would make one revision a
              day, without a dependency having moved.
              """
              try:
                  d = json.load(open(path))
              except Exception:
                  return None
              found = []

              def walk(items):
                  for c in items or []:
                      if c.get("name"):
                          found.append((c.get("name", ""),
                                        str(c.get("version", ""))))
                      walk(c.get("components"))

              walk(d.get("components"))
              return sorted(found)

          before = (useful("/tmp/before-software.json"),
                    useful("/tmp/before-project.json"))
          after = (useful("src/phytoscope/sbom.cdx.json"),
                   useful("sbom.cdx.json"))
          changed = before != after
          before = [x for p in before for x in (p or [])]
          after = [x for p in after for x in (p or [])]
          print(f"change={'yes' if changed else 'no'}")
          if changed:
              a = dict(before or []); b = dict(after or [])
              rows = []
              for name in sorted(set(a) | set(b)):
                  if a.get(name) != b.get(name):
                      rows.append(f"  {name} : {a.get(name, '—')} → {b.get(name, '—')}")
              print("resume<<END")
              print("\n".join(rows) or "  (the structure changed)")
              print("END")
          PY

      - name: What changed
        if: steps.diff.outputs.change == 'yes'
        run: |
          echo "${{ steps.diff.outputs.resume }}"

      # -- on main: commit it back ----------------------------------------
      - name: Commit the SBOM back on main
        if: steps.diff.outputs.change == 'yes' && github.event_name == 'push'
        run: |
          #  The same address as the human commits: the repository should
          #  show only that one. The NAME stays `phytoscope-ci`, so that one
          #  sees at a glance what came from the chain.
          git config user.name  'phytoscope-ci'
          git config user.email 'thierry.gayet@gmail.com'
          git add src/phytoscope/sbom.cdx.json sbom.cdx.json
          git commit -m "$(printf 'regenerate the bill of materials\n\nThe software or its dependencies changed in %s.\nA false SBOM is worse than no SBOM: its purpose is to answer\n\u201cdoes this vulnerability concern me?\u201d.\n\n%s' \
            "${GITHUB_SHA::12}" "${{ steps.diff.outputs.resume }}")"
          git push

      # -- on a pull request: report, do not write -------------------------
      - name: Report the discrepancy on the pull request
        if: steps.diff.outputs.change == 'yes' && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const summary = `${{ steps.diff.outputs.resume }}`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                "### The bill of materials has changed",
                "",
                "The bills of materials no longer match the dependencies",
                "that are really installed:",
                "",
                "```",
                summary,
                "```",
                "",
                "To regenerate before merging:",
                "",
                "```bash",
                "cd src/phytoscope",
                "python3 tools/sbom.py --ecrire --logiciel-seul",
                "```",
                "",
                "_A false SBOM is worse than no SBOM: its purpose is to",
                "answer \"does this vulnerability concern me?\"._",
              ].join("\n"),
            });

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: |
            src/phytoscope/sbom.cdx.json
            sbom.cdx.json
          retention-days: 30
