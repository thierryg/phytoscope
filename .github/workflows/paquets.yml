# ===========================================================================
#  PhytoScope — analyse statique puis fabrication des paquets
# ===========================================================================
#  Se déclenche dès qu'une modification touche la fabrique de paquets
#  (« packaging/ ») ou le code (« src/ ») : ce sont les deux seules
#  choses dont un paquet dépend. Modifier un ouvrage ne relance pas cette
#  chaîne — c'est « ouvrages.yml » qui s'en occupe.
#
#  Deux temps, dans cet ordre :
#
#    1. « lint » — l'analyse statique de TOUT ce qui est exécutable : Python,
#       shell, Makefile, YAML. Rien ne se fabrique si elle échoue : un paquet
#       bâti sur un script fautif est un paquet qu'il faudra republier.
#
#    2. « paquets » — une fabrication par système cible, en parallèle, pour
#       que la panne se lise d'un coup d'œil : c'est Windows qui a cassé, ou
#       Fedora. Puis « paquets-signes » rejoue la chaîne complète dans le bon
#       ordre, signature comprise, parce que la signature Authenticode MODIFIE
#       le .exe et le .msi et que les empreintes se calculent après elle.
#
#  La signature utilise un certificat AUTO-SIGNÉ fabriqué sur le coureur et
#  jeté avec lui. La vraie clé privée du projet n'entre jamais ici : elle vit
#  dans ~/.local/share/phytoscope-signature/ sur le poste de l'éditeur, et
#  aucun secret de dépôt n'est déclaré pour cette chaîne (C-2R).
# ===========================================================================
name: Paquets

on:
  push:
    branches: [main]
    paths:
      - 'packaging/**'
      - 'src/**'
      - '.github/workflows/paquets.yml'
  pull_request:
    paths:
      - 'packaging/**'
      - 'src/**'
      - '.github/workflows/paquets.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paquets-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:

  # -------------------------------------------------------------------------
  #  1. Analyse statique
  # -------------------------------------------------------------------------
  lint:
    name: Analyse statique
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Outils d'analyse
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff yamllint
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck

      # --- Python -----------------------------------------------------------
      #  D'abord la syntaxe : un fichier qui ne compile pas rend tout le reste
      #  illisible. Puis ruff, qui porte les règles du projet.
      - name: Python — syntaxe
        run: |
          python -m compileall -q packaging src/phytoscope tools \
            build.py build_arbre.py build_carte.py build_sdk.py

      #  Ce pas BLOQUE : syntaxe et noms inexistants. Ce sont des plantages,
      #  pas des questions de style. Le jeu de règles est déclaré dans
      #  src/phytoscope/pyproject.toml, [tool.ruff.lint], avec le pourquoi.
      - name: Python — erreurs réelles (bloquant)
        run: |
          ruff check --output-format=github \
            --select E9,F821,F822,F823,F811 \
            packaging tools src/phytoscope pdf-src/build.py \
            pdf-src/build_arbre.py pdf-src/build_annexe.py \
            pdf-src/build_carte.py pdf-src/build_sdk.py

      #  Ces pas INFORMENT sans bloquer : plus de mille avertissements de
      #  style héritent d'un code écrit pour Python 3.9, et les corriger d'un
      #  coup produirait une révision illisible. Le compte est affiché à
      #  chaque passage, ce qui rend la dette visible sans arrêter la chaîne.
      - name: Python — style et modernisation (informatif)
        run: |
          ruff check --statistics --select ALL --ignore D,ANN,COM812,ISC001 \
            packaging tools src/phytoscope || true
        continue-on-error: true

      - name: Python — mise en forme (informatif)
        run: ruff format --check --diff packaging tools src/phytoscope
        continue-on-error: true

      # --- Shell ------------------------------------------------------------
      #  « src/firmware/_make_.sh » est du bash strict et volontairement non
      #  portable (voir .ai/portabilite.md) : shellcheck est lancé en mode
      #  bash, pas sh, sans quoi il signale des faux positifs.
      - name: Shell — shellcheck
        run: |
          mapfile -t scripts < <(git ls-files '*.sh' | grep -v '^sources/')
          if [ ${#scripts[@]} -eq 0 ]; then echo "aucun script"; exit 0; fi
          printf '  · %s\n' "${scripts[@]}"
          shellcheck --shell=bash --severity=warning --color=always "${scripts[@]}"

      - name: Shell — les .run produits sont-ils du shell valide ?
        run: |
          for f in $(git ls-files 'packaging/gabarits/*.run*' 2>/dev/null); do
            bash -n "$f" && echo "  · $f : syntaxe correcte"
          done

      # --- Makefile ---------------------------------------------------------
      #  On ne peut pas « make -n » la fabrique sans ses outils ; on contrôle
      #  donc ce qui se contrôle sans eux : que make sait lire le fichier et
      #  que les cibles annoncées existent bien.
      - name: Makefile — lecture et cibles
        run: |
          for mf in packaging/Makefile src/phytoscope/Makefile; do
            echo "── $mf"
            make -f "$mf" -p --question >/dev/null 2>&1 || true
            make -f "$mf" --dry-run aide >/dev/null && echo "  · lisible par make"
          done
          echo "── cibles attendues de packaging/Makefile"
          for cible in outils deps debian fedora windows macos source linux tout \
                       certificat signer verifier propre; do
            grep -qE "^${cible}:" packaging/Makefile \
              && echo "  · $cible" \
              || { echo "  ! cible manquante : $cible"; exit 1; }
          done

      - name: Makefile — tabulations (une recette indentée par espaces est muette)
        run: |
          for mf in $(git ls-files '*Makefile' 'Makefile' | grep -v '^sources/'); do
            if grep -nP '^    [a-zA-Z@$]' "$mf"; then
              echo "! $mf : recette indentée par des espaces"; exit 1
            fi
          done
          echo "  · indentation correcte"

      # --- YAML et divers ---------------------------------------------------
      - name: YAML — yamllint
        run: |
          yamllint -c .yamllint.yml .github/

      - name: Les en-têtes d'attribution sont-ils à jour ?
        run: python3 tools/entetes.py --verifier

  # -------------------------------------------------------------------------
  #  2a. Une fabrication par système cible, en parallèle
  # -------------------------------------------------------------------------
  paquets:
    name: Paquets — ${{ matrix.nom }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - cible: source
            nom: Source (.tar.gz, .zip)
            apt: ''
          - cible: debian
            nom: Debian / Ubuntu / Mint (.deb, .run)
            apt: dpkg-dev fakeroot
          - cible: fedora
            nom: Fedora / RHEL (.rpm)
            apt: rpm
          - cible: windows
            nom: Windows 10/11 (.exe, .msi, .zip)
            apt: nsis msitools osslsigncode
          - cible: macos
            nom: macOS / Darwin (.pkg, .zip)
            apt: xar cpio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Outils système de la cible
        if: matrix.apt != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Ce que la fabrique voit
        run: cd packaging && make outils

      #  « make deps » déplie NSIS, msitools et osslsigncode dans ~/.local/opt
      #  sans sudo (C-55). Sur le coureur, apt les a déjà : la cible sert de
      #  filet, et son échec n'est pas bloquant.
      - name: Compléter les outils manquants, sans sudo
        run: cd packaging && make deps
        continue-on-error: true

      - name: Fabriquer — ${{ matrix.cible }}
        run: cd packaging && make ${{ matrix.cible }}

      - name: Ce qui a été produit
        run: |
          find build/paquets -type f -printf '%10s  %p\n' | sort -k2

      - uses: actions/upload-artifact@v7
        with:
          name: paquets-${{ matrix.cible }}
          path: build/paquets/
          if-no-files-found: error
          retention-days: 14

  # -------------------------------------------------------------------------
  #  2b. La chaîne complète, dans l'ordre, signature comprise
  # -------------------------------------------------------------------------
  paquets-signes:
    name: Chaîne complète signée et vérifiée
    needs: lint
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Tous les outils d'empaquetage
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev fakeroot rpm nsis msitools osslsigncode xar cpio
          cd packaging && make deps || true

      #  Certificat AUTO-SIGNÉ fabriqué ici et jeté avec le coureur. Il sert à
      #  prouver que la chaîne de signature fonctionne, rien de plus : il ne
      #  fait taire ni SmartScreen ni Gatekeeper (C-2Q), et ce n'est pas le
      #  certificat de diffusion du projet.
      - name: Certificat éphémère d'intégration
        run: cd packaging && make certificat

      - name: make tout
        run: cd packaging && make tout

      - name: make verifier — rouvrir et contrôler chaque paquet
        run: cd packaging && make verifier

      - name: Aucun secret n'a fui dans les paquets
        run: |
          if find build/paquets -name '*.key' -o -name 'phytoscope.key' | grep -q .; then
            echo "! une clé privée se trouve dans les paquets"; exit 1
          fi
          echo "  · aucune clé privée dans les produits"

      - uses: actions/upload-artifact@v7
        with:
          name: paquets-complets-signes
          path: build/paquets/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  #  2c. Le micrologiciel — un livrable à part entière
  # -------------------------------------------------------------------------
  #  Le `.uf2` est ce qu'on copie sur la carte : sans lui, les paquets
  #  installent un logiciel qui n'a rien à écouter. Il se compile ici, à
  #  chaque fois, plutôt qu'à la main sur le poste de l'éditeur — un binaire
  #  fabriqué à la main est un binaire dont personne ne sait de quel commit
  #  il sort.
  #
  #  `build.sh --deps` installe le Pico SDK et la chaîne ARM dans $HOME, sans
  #  sudo (C-55). Seuls cmake et le compilateur croisé viennent d'apt.
  micrologiciel:
    name: Micrologiciel RP2350 (.uf2)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Chaîne de compilation croisée
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential \
            libstdc++-arm-none-eabi-newlib

      #  Le SDK est volumineux et sa version est figée dans _make_.sh : on le
      #  garde d'un passage à l'autre plutôt que de le retélécharger.
      - name: Retrouver le Pico SDK d'un passage à l'autre
        id: sdk
        uses: actions/cache@v6
        with:
          path: ~/pico
          key: pico-sdk-${{ hashFiles('src/firmware/_make_.sh') }}

      - name: Pico SDK et chaîne ARM, dans $HOME et sans sudo
        if: steps.sdk.outputs.cache-hit != 'true'
        working-directory: src/firmware
        run: ./build.sh --deps

      #  `build.sh` compile PUIS range le livrable dans build/paquets/, nommé
      #  avec sa version et accompagné de ses empreintes et d'une notice.
      #  C'est la même sortie que la fabrique de paquets : le micrologiciel
      #  est un livrable, pas un produit intermédiaire.
      - name: Compiler et ranger le livrable
        working-directory: src/firmware
        run: ./build.sh

      #  Un .uf2 de quelques kilooctets est un .uf2 vide : le seuil attrape
      #  l'effondrement, pas la variation. Le contrôle des identifiants USB,
      #  lui, est fait par la suite de tests — elle lit la source.
      - name: Le livrable est-il là, et fait-il la bonne taille ?
        run: |
          uf2=$(find build/paquets -name 'phytosense-*.uf2' | head -1)
          test -n "$uf2" || { echo "! pas de .uf2 rangé"; exit 1; }
          taille=$(stat -c%s "$uf2")
          echo "  · $uf2 : $taille octets"
          if [ "$taille" -lt 32768 ]; then
            echo "! trop petit — la compilation a produit un binaire vide"
            exit 1
          fi
          test -f "$(dirname "$uf2")/LISEZ-MOI.txt" \
            || { echo "! notice absente du livrable"; exit 1; }
          arm-none-eabi-size src/firmware/build/phytosense.elf
          echo "── empreintes"
          cat "$(dirname "$uf2")"/phytosense-*.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: micrologiciel-phytosense
          path: build/paquets/*/Firmware/
          if-no-files-found: error
          retention-days: 30

  # -------------------------------------------------------------------------
  #  3. Le logiciel sur chaque système, réellement
  # -------------------------------------------------------------------------
  #  Fabriquer un .pkg depuis Linux ne dit pas que le logiciel tourne sous
  #  macOS. Les tests, eux, le disent — et .ai/portabilite.md tient le relevé
  #  des écarts entre systèmes.
  logiciel:
    name: Tests — ${{ matrix.os }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Dépendances
        working-directory: src/phytoscope
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      #  Aucun test n'a besoin de matériel ni de réseau, mais Qt a besoin d'un
      #  serveur d'affichage : en mode « offscreen », il n'en demande aucun.
      #  XDG_CONFIG_HOME est détourné vers un dossier jetable : le logiciel ne
      #  doit jamais écrire dans les réglages de qui l'exécute.
      - name: Tests
        working-directory: src/phytoscope
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          export XDG_CONFIG_HOME="$(mktemp -d)"
          python -m pytest tests -q
