blank_issues_enabled: false
contact_links:
  - name: Security vulnerability
    url: https://github.com/thierryg/phytoscope/security/advisories/new
    about: >
      Do NOT open a public issue for a vulnerability. Use a private advisory,
      or write to contact@bretagne-namaste.com with "[security]" in the
      subject. See SECURITY.md.
  - name: A question about using it
    url: https://github.com/thierryg/phytoscope/discussions
    about: >
      For "how do I…", the discussions suit better than an issue. Read
      src/phytoscope/README.txt and src/sdk/docs/ first.
