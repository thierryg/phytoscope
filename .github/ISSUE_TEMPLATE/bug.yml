name: Bug
description: Something does not work the way it is advertised
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time. A bug one can reproduce is already
        half fixed; a bug one cannot reproduce costs hours for nothing.

        **If this is a security vulnerability, close this form** and read
        `SECURITY.md`.

  - type: textarea
    id: expected-observed
    attributes:
      label: What you expected, and what happened
      placeholder: |
        I expected: …
        What happened: …
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce it
      description: The shortest sequence of actions that makes it appear.
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: '`phytoscope --version`, or the contents of src/phytoscope/phytoscope/VERSION'
      placeholder: '1.6.0'
    validations:
      required: true

  - type: dropdown
    id: system
    attributes:
      label: System
      options:
        - Debian / Ubuntu / Mint
        - Fedora / RHEL / Rocky
        - Another Linux
        - Windows 10
        - Windows 11
        - macOS
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: '`python3 --version`'
      placeholder: '3.12.3'

  - type: dropdown
    id: area
    attributes:
      label: Which part of the project
      options:
        - The software (src/phytoscope)
        - The firmware (src/firmware)
        - The module kit (src/sdk)
        - The package factory (packaging)
        - The PDF publications (pdf-src, build_*.py)
        - The hardware (hardware)
        - I do not know
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: The log, or the error message
      description: >
        Paste the whole traceback. The software's log is found through
        `make doctor`, which prints its path.
      render: text

  - type: checkboxes
    id: prerequisites
    attributes:
      label: Checks
      options:
        - label: I ran `make doctor` and read what it reported
        - label: I looked for an existing issue
        - label: >
            This is not the fact that a self-signed certificate triggers
            SmartScreen or Gatekeeper — that is expected, see
            packaging/README.md
