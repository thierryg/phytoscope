# ===========================================================================
#  PhytoScope — dependency updates
# ===========================================================================
#  Why weekly and grouped: the project will not add a mandatory dependency
#  lightly (C-40), and therefore has only a few. One batch a week gets read;
#  one batch a day does not.
# ===========================================================================
version: 2
updates:

  # --- The software --------------------------------------------------------
  - package-ecosystem: pip
    directory: /src/phytoscope
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    labels: [dependencies, software]
    commit-message:
      prefix: 'dependencies'
    groups:
      development-tools:
        patterns: ['pytest*', 'ruff', 'bandit', 'pip-audit', 'pre-commit']
        dependency-type: development
    #  A major change to a runtime dependency is decided by hand: it can
    #  break the portability that .ai/portability.md keeps up to date.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  # --- The continuous-integration actions ----------------------------------
  #  An action pinned to a version that disappears breaks the whole CI
  #  without anybody having touched the code.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/Paris
    labels: [dependencies, ci]
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns: ['*']
