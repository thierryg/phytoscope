# ===========================================================================
#  PhytoScope — the guards run before every commit
# ===========================================================================
#  Install once:
#
#      python3 -m pip install --user pre-commit
#      pre-commit install
#
#  To run everything over the whole repository:
#
#      pre-commit run --all-files
#
#  The guard that matters is the last one, "detect-signing-key". The others
#  catch slips; that one stops the key that signs the packages from being
#  published. See SECURITY.md and certificate/README.md.
# ===========================================================================
exclude: |
  (?x)^(
      sources/.*          |   # third-party code: its conventions, not ours
      LICENSES/.*         |   # official texts, not to be modified
      pdf-src/_.*\.html$      |   # generated assemblies
      pdf-src/assets/svg/.*\.svg$ |
      build/.*
  )$

repos:

  # --- Basic slips ---------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: [--fix=lf]
      #  A Makefile recipe indented with spaces is mute: make ignores it
      #  without a word. It happened, hence this check.
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      #  A large file committed by mistake stays in the history for ever.
      #  The produced PDFs and the third-party archives are out of tree.
      - id: check-added-large-files
        args: [--maxkb=2048]
      - id: detect-private-key

  # --- Python --------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # --- Shell ---------------------------------------------------------------
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
        args: [--shell=bash, --severity=warning]

  # --- Checks particular to this project -----------------------------------
  - repo: local
    hooks:

      #  The private signing key must NEVER be staged (C-2R).
      #  detect-private-key above looks for a PEM block in the content; this
      #  one refuses the file on its name alone — even empty, even renamed,
      #  which is the case that came close to happening here.
      - id: detect-signing-key
        name: the private signing key stays out of the repository
        entry: >
          bash -c '
          offenders=$(printf "%s\n" "$@" | grep -Ei "\.(key|p12|pfx|jks|keystore|kdbx)$" || true);
          if [ -n "$offenders" ]; then
            echo "refused — these files must not be version-controlled:";
            echo "$offenders";
            echo "the signing key lives in ~/.local/share/phytoscope-signature/";
            exit 1;
          fi' --
        language: system
        pass_filenames: true
        always_run: true

      #  An attribution header carries the file's path: moving the file
      #  makes it stale, and a file that travels alone would then lie about
      #  where it came from.
      - id: attribution-headers
        name: attribution headers are up to date
        entry: python3 tools/headers.py --verifier
        language: system
        pass_filenames: false
        files: ^(src|pdf|tools|packaging|hardware|sources/reverse)/

      #  An illustration that is not well-formed XML gives an empty frame in
      #  the PDF with nothing to say so. The defect has happened:
      #  timeline.svg carried a bare "&", written by a generator that did not
      #  escape its text (journal, 2026-09-18).
      - id: svg-well-formed
        name: figures are well-formed XML
        entry: python3 tools/verify_svg.py
        language: system
        files: \.svg$
