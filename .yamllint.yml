# ===========================================================================
#  PhytoScope — yamllint settings
# ===========================================================================
#  GitHub Actions files have two peculiarities that make the default
#  configuration shout without there being anything to fix: the key "on:" is
#  read as the boolean "true", and shell command lines in them are naturally
#  long. Those two are tolerated; everything else stays checked.
# ===========================================================================
extends: relaxed

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

#  `.ecarte/` was listed here until 2026-09-23, when it was deleted: 857 MB
#  of an obsolete virtual environment, duplicates and a dead CMake cache.
ignore: |
  sources/
  build/
