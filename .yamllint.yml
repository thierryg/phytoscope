# ===========================================================================
#  PhytoScope — réglages de yamllint
# ===========================================================================
#  Les fichiers d'Actions GitHub ont deux particularités qui font hurler la
#  configuration par défaut, sans qu'il y ait quoi que ce soit à corriger :
#  la clé « on: » est lue comme le booléen « true », et les lignes de
#  commandes shell y sont naturellement longues. On les tolère ; le reste
#  reste contrôlé.
# ===========================================================================
extends: relaxed

rules:
  line-length:
    max: 120
    allow-non-breakable-words: true
  truthy:
    allowed-values: ['true', 'false']
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: consistent
  braces:
    max-spaces-inside: 1
  brackets:
    max-spaces-inside: 1

ignore: |
  .ecarte/
  sources/
  build/
